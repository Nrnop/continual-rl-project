# LayerNorm on every hidden layer: vanilla on the HalfCheetah reward-flip benchmark with boundary
# reset, sigma 0.37. Identical to s14reset_van.yaml except layer_norm: true, applied to all three
# arms as a standard plasticity-loss mitigation. LayerNorm adds 2h parameters per hidden layer;
# parity stays within 1%.

adam_eps: 1.0e-05
agent: vanilla
anneal_lr: false
async_envs: true
clip_coef: 0.2
clip_obs: 10.0
clip_reward: 10.0
critic_hidden_sizes:
- 64
- 64
decay_gain_probe: false
ent_coef: 0.0
env_id: HalfCheetah-v5
env_mode: directional
epochs: 10
freeze_log_std: true
gae_lambda: 0.95
gamma: 0.99
hidden_sizes:
- 64
- 64
joint_grad_clip: false
jumpstart_window_updates: 20
layer_norm: true
log_std_init: -1.0
lr_actor: 0.0003
lr_critic: 0.0003
lr_trans: 0.0003
max_grad_norm: 0.5
minibatch_size: 64
n_steps: 256
normalize_advantage: true
normalize_obs: true
normalize_reward: true
normalizer_freeze_after: 100000
num_envs: 8
probe_states: 256
reset_on_task_switch: true
step_by_step: false
switch: 614400
target_kl: null
tasks:
- 1
- -1
total_steps: 3072000
transfer_eval_episodes: 0
