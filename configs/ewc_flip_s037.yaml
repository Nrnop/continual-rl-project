# EWC in a setup where it has never been run.
#
# PT beats vanilla ONLY where exploration is held fixed at 0.37, and every EWC number we
# have comes from agent-tuned-exploration runs. So PT's one advantage has never been tested
# against the strongest baseline. These configs close that gap.
#
# The PPO settings are copied from the matching vanilla arm of the setup being matched, so
# EWC differs from that arm ONLY by being EWC.
transfer_eval_episodes: 0
decay_gain_probe: false

adam_eps: 1.0e-05
agent: ewc
anneal_lr: false
async_envs: true
clip_coef: 0.2
clip_obs: 10.0
clip_reward: 10.0
critic_hidden_sizes:
- 64
- 64
ent_coef: 0.0
env_id: HalfCheetah-v5
env_mode: directional
epochs: 10
freeze_log_std: true
gae_lambda: 0.95
gamma: 0.99
hidden_sizes:
- 64
- 64
joint_grad_clip: false
jumpstart_window_updates: 20
log_std_init: -1.0
lr_actor: 0.0003
lr_critic: 0.0003
lr_trans: 0.0003
max_grad_norm: 0.5
minibatch_size: 64
n_steps: 256
normalize_advantage: true
normalize_obs: true
normalize_reward: true
normalizer_freeze_after: 100000
num_envs: 8
probe_states: 256
reset_on_task_switch: false
step_by_step: false
switch: 614400
target_kl: null
tasks:
- 1
- -1
total_steps: 3072000
