# PT with the permanent initialised to ZERO — the reference's own initialisation.
#
# Identical to configs/pt_paper.yaml in every respect except ONE BIT: perm_zero_init: true.
# The mechanism is LIVE here (decay 0.95, k 60, consolidation on) — this is not the Theorem-1
# control, it is the real agent. It is therefore a clean single-variable comparison against the
# `pt` arm of the final sweep, which is pt_paper.yaml with a randomly initialised permanent.
#
# WHY. A deep search of the reference implementation (2026-08-04) found that EVERY version of the
# authors' code starts the permanent value function at (or within rounding of) zero:
#
#   prediction_semi_crl/tabular_linear/PT_Mem.py   w_1 = np.zeros_like(...)      EXACTLY 0
#   control/tabular/PT_q_learning_crl.py           w_1 = np.zeros_like(...)      EXACTLY 0
#   prediction_semi_crl/minigrid/model.py          nn.init.normal_(w, 0, 0.01)   ~1e-4
#   control/minatar_crl/model.py                   no explicit init (torch default)
#
# The tabular and linear versions are the ones the theorems apply to and the ones that produce
# Figures 2, 3b and 4. They initialise BOTH components to zero. The deep prediction version uses
# normal_(0, 0.01), which on our architecture measures |V_perm| = 0.000112.
#
# Ours used mlp(..., out_gain=1.0) -- orthogonal, gain 1.0 -- measuring |V_perm| = 0.4046.
# That is 3628x the reference's deep initialisation and infinitely more than its tabular one. No
# reference implementation anywhere uses orthogonal gain 1.0 for the permanent.
#
# WHY IT MATTERS MECHANICALLY. alpha_P is small BY DESIGN (it is the slow timescale), so theta_P
# barely moves: measured perm/drift_from_init ~0.3 against value magnitudes of O(1). V_perm is
# therefore dominated by its initialisation for the entire run. The transient's regression target
# is R - V_perm, i.e. the value function minus a fixed, unstructured, high-frequency function it
# must cancel on every state it visits. It memorises that cancellation on states it trains on and
# fails on NEW ones -- exactly the post-switch regime, which is where the whole deficit lives
# (phase 1 at parity in three independent clean tests; every later phase significantly worse).
#
# With V_P(s) = 0 for all s, there is nothing to cancel and the transient regresses directly on the
# returns, exactly as the tabular reference does.
#
#   python -m src_continuous_control.train --agent pt --config pt_zeroperm --seed 0
#
# Compare against: the `pt` arm of the final sweep (pt_paper.yaml, 10 seeds, already run).
# One bit different. Expect the INERT PERMANENT banner NOT to fire -- the mechanism is live.

agent: "pt"

step_by_step: false
normalize_obs: true
normalize_reward: true
clip_obs: 10.0
clip_reward: 10.0
anneal_lr: false
hidden_sizes: [64, 64]
adam_eps: 0.00001
gamma: 0.99
gae_lambda: 0.95
clip_coef: 0.2
ent_coef: 0.0
max_grad_norm: 0.5
target_kl: null
normalize_advantage: true
lr_actor: 0.0003
lr_critic: 0.0003
epochs: 10
minibatch_size: 64
num_envs: 8
async_envs: true
n_steps: 256

joint_grad_clip: false
critic_hidden_sizes: [43, 43]
lr_trans: 0.0003
lr_perm: 0.0002
perm_optimizer: "sgd"
alpha_p_rm_power: 0.6
decay_mode: "output"
k: 60
decay: 0.95
consolidation_epochs: 1
consolidation_buffer_size: 122880
value_preserving_consolidation: false
on_switch: "consolidate"

# --- THE ONLY DIFFERENCE from pt_paper.yaml ---
perm_zero_init: true       # V^(P)_0 = 0, as in w_1 = np.zeros_like(...)
trans_zero_init: true      # V^(T)_0 = 0, as in w_2 = np.zeros_like(w_1)

jumpstart_window_updates: 20
probe_states: 256

tasks: [1, -1]
switch: 614400
total_steps: 3072000
