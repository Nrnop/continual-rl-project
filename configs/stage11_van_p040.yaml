# STAGE 11 -- DRIFT FREQUENCY LADDER. Stage 4 found the ONLY positive result for the
# permanent-transient mechanism (live - inert = +5.6, p=0.000) but measured it at a single
# drift period. The specification's own §8.1 predicts this axis matters:
#   'Lipschitz bounds L must be declared per domain to distinguish HIGH-FREQUENCY
#    non-stationarity (where the transient dominates) from LOW-FREQUENCY structural
#    drift (where consolidation captures the centroid).'
# So live-minus-inert should GROW with the period. That is a directional prediction the
# theory makes and this ladder can falsify.
# period 40000 (9.0 cycles - fast drift); Lipschitz bound L = 7.854e-05 per env step
# ARM: van
env_mode: point_drift
point_target: 0.0
point_dt: 0.1
point_base_drag: 0.35
point_action_scale: 1.0
point_position_limit: 2.0
point_velocity_limit: 2.0
max_episode_steps: 200
drift_amplitude: 0.75
drift_period: 40000
drift_schedule: sin
drift_phase: 0.0
step_by_step: false
num_envs: 4
async_envs: false
n_steps: 256
epochs: 4
minibatch_size: 64
hidden_sizes:
- 64
- 64
critic_hidden_sizes:
- 64
- 64
trans_hidden_sizes:
- 32
- 32
actor_trans_hidden_sizes:
- 32
- 32
critic_trans_hidden_sizes:
- 32
- 32
normalize_obs: true
normalize_reward: true
normalizer_freeze_after: 60000
clip_obs: 10.0
clip_reward: 10.0
lr_actor: 0.0003
lr_critic: 0.0003
ent_coef: 0.0
target_kl: null
anneal_lr: false
total_steps: 360000
switch: 100000
eval_interval_updates: 5
no_eval: true
rho: 0.5
k: 8
consolidation_epochs: 2
consolidation_buffer_size: 8192
lr_trans: 0.0003
lr_perm: 0.001
lr_perm_actor: 0.001
rm_power: 0.6
rm_power_actor: 0.6
kl_prior_coef: 0.01
agent: vanilla
freeze_log_std: true
