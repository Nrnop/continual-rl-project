# DOES THE CONSOLIDATION TRANSFER GENERALISE, OR IS THE PERMANENT MEMORISING ITS BUFFER?
#
# Identical to configs/pt_zeroperm.yaml except `consolidation_holdout_frac: 0.2`.
#
# THE QUESTION. `absorbed_frac` — the number used throughout REINVESTIGATION.md as evidence that
# the mechanism runs — is computed on the SAME states the consolidation regression trained on. It
# is an in-distribution measurement. A permanent that had memorised the consolidation buffer and
# extrapolated badly would report a perfectly healthy 0.10 and be wrong everywhere else.
#
# "Everywhere else" is exactly where it gets used. After consolidating, the agent immediately
# collects a NEW rollout and bootstraps GAE from V_perm + V_trans on states it never consolidated
# on. If the permanent is wrong there, every advantage in that rollout is corrupted — and worst
# right after a task switch, when the state distribution has just moved.
#
# That is the shape of the deficit this project has been unable to explain: phase 1 at parity in
# three independent tests, every post-switch phase worse, and the mechanism, the capacity and the
# initialisation each ruled out as the sole cause.
#
# WHY IT IS PLAUSIBLE. Offline, on the real 20 480-state consolidation batch (FINDINGS 6.3), the
# target old_V_perm + V_trans IS fittable — a [256,256] net reaches 3.2% train error — but held-out
# error floors at 38-44% and gets WORSE the harder it is fitted (23.8 -> 3.2 on the batch while
# held-out goes 38.4 -> 44.2). Textbook memorisation. Whether that happens in situ has never been
# measured on a permanent that actually moves: the one earlier holdout run (FINDINGS 5.6) was made
# while theta_P was inert, so both numbers were trivially near zero and the comparison was void.
#
# WHAT TO READ. `consol/absorbed_frac` (fitted states) against `consol/absorbed_frac_holdout`
# (states excluded from the regression), and the same pair for `absorbed_align`:
#
#   holdout ~= fitted (~0.10)   -> the transfer generalises. Memorisation is ruled out and this
#                                  line of enquiry closes.
#   holdout ~= 0, or align < 0  -> the permanent is memorising its buffer. `absorbed_frac` has
#                                  been overstating the mechanism, the acting value is corrupted
#                                  on exactly the states it is next used for, and this is a real
#                                  defect in the place the deficit lives.
#
# CAVEAT — NOT SEED-COMPARABLE. The holdout path consumes a different RNG stream from the default
# one (np.random.permutation + torch.randperm in place of np.random.shuffle), so returns from this
# config cannot be compared seed-by-seed against pt_zeroperm. That is fine: this run measures a
# MECHANISM, not a return difference. Do not read its returns as a comparison.
#
#   python -m src_continuous_control.train --agent pt --config abl_pt_holdout --seed 0

agent: "pt"

step_by_step: false
normalize_obs: true
normalize_reward: true
clip_obs: 10.0
clip_reward: 10.0
anneal_lr: false
hidden_sizes: [64, 64]
adam_eps: 0.00001
gamma: 0.99
gae_lambda: 0.95
clip_coef: 0.2
ent_coef: 0.0
max_grad_norm: 0.5
target_kl: null
normalize_advantage: true
lr_actor: 0.0003
lr_critic: 0.0003
epochs: 10
minibatch_size: 64
num_envs: 8
async_envs: true
n_steps: 256

joint_grad_clip: false
critic_hidden_sizes: [43, 43]
lr_trans: 0.0003
lr_perm: 0.0002
perm_optimizer: "sgd"
alpha_p_rm_power: 0.6
decay_mode: "output"
k: 60
decay: 0.95
consolidation_epochs: 1
consolidation_buffer_size: 122880
value_preserving_consolidation: false
on_switch: "consolidate"
perm_zero_init: true
trans_zero_init: true

# --- THE ONLY DIFFERENCE from pt_zeroperm.yaml ---
consolidation_holdout_frac: 0.2    # 20% of the buffer excluded from the regression

jumpstart_window_updates: 20
probe_states: 256

tasks: [1, -1]
switch: 614400
total_steps: 3072000
