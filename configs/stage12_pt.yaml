# STAGE 12 -- HALFCHEETAH CONFIRMATION of the Stage 9/10 reduction on real physics.
# Claim under test: pt_full's advantage over vanilla is periodic multiplicative shrinkage
# of the policy, not permanent-transient memory. On point-mass, vanilla + 3 lines matched
# the full apparatus at every decay factor (p >= 0.44).
#
# PARAMETER PARITY (computed, not guessed): vanilla actor+critic at [64,64] = 11 085 params;
# pt_full with perm [51,51] and trans [32,32] = 11 005 (0.993x). Without this the
# comparison measures capacity, and pt_full's shipped [256,256] config is 4 nets against 2.
#
# SIGMA IS FROZEN ON EVERY ARM. pt_full freezes log_std by Constraint C4 while vanilla
# learns it; on HalfCheetah that gap is large (sigma 0.072 vs 0.140, FINDINGS §2) and would
# confound every comparison here.
# ARM: full pt_full apparatus, live permanent
env_id: HalfCheetah-v5
tasks:
- 1
- -1
switch: 614400
total_steps: 3072000
step_by_step: false
num_envs: 8
async_envs: true
n_steps: 256
epochs: 10
minibatch_size: 64
gamma: 0.99
gae_lambda: 0.95
clip_coef: 0.2
ent_coef: 0.0
max_grad_norm: 0.5
target_kl: null
normalize_advantage: true
anneal_lr: false
adam_eps: 1.0e-05
lr_actor: 0.0003
lr_critic: 0.0003
lr_trans: 0.0003
normalize_obs: true
normalize_reward: true
normalizer_freeze_after: 100000
clip_obs: 10.0
clip_reward: 10.0
freeze_log_std: true
jumpstart_window_updates: 20
probe_states: 256
joint_grad_clip: false
agent: pt_full
hidden_sizes:
- 51
- 51
critic_hidden_sizes:
- 51
- 51
trans_hidden_sizes:
- 32
- 32
actor_trans_hidden_sizes:
- 32
- 32
critic_trans_hidden_sizes:
- 32
- 32
rho: 0.5
k: 8
consolidation_epochs: 2
consolidation_buffer_size: 16384
kl_prior_coef: 0.01
lr_perm: 0.0003
lr_perm_actor: 0.0003
rm_power: 0.6
rm_power_actor: 0.6
