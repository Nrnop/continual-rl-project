# REPLICATION OF PHASE 1 STAGE 14 / FULL_PT.md 24 — the run in which `pt_full` beat vanilla.
#
#   vanilla PPO            final phase  49.9
#   pt_full live permanent final phase 760.1   (+710.3 over vanilla, p = 0.015, 6 seeds)
#
# Every key below is copied verbatim from the archived `stage14_{arm}.yaml`, so this reproduces
# that comparison with TODAY's code. If it reproduces, the Phase 1 result stands and the Phase 2a
# finding is benchmark-specific (PT helps under a REWARD FLIP, not under a physics change). If it
# does not, something in the code has changed since and that is the real defect to hunt.
#
# THREE things here differ from the Phase 2a sweep, and two of them were Phase 2a's mistakes:
#   env_mode: directional  — the reward-flip benchmark, not the physics change (intended).
#   log_std_init: -1.0     — sigma 0.368. Phase 1 24 exists precisely because sigma = 1.0 is
#                            "heavy noise for HalfCheetah"; Phase 2a ran at 1.0 anyway.
#   anneal_lr: false       — Phase 1 already had this off. Phase 2a left it on, which silently
#                            overwrote the Robbins-Monro schedule and killed `rm_power`.
#
# The transfer matrix and the decay probe are disabled: neither existed in Phase 1, and although
# both are RNG-isolated and cannot change training, they cost roughly 15 minutes per run.
env_mode: "directional"
transfer_eval_episodes: 0
decay_gain_probe: false

adam_eps: 1.0e-05
agent: vanilla
anneal_lr: false
async_envs: true
clip_coef: 0.2
clip_obs: 10.0
clip_reward: 10.0
critic_hidden_sizes:
- 64
- 64
ent_coef: 0.0
env_id: HalfCheetah-v5
epochs: 10
freeze_log_std: true
gae_lambda: 0.95
gamma: 0.99
hidden_sizes:
- 64
- 64
joint_grad_clip: false
jumpstart_window_updates: 20
log_std_init: -1.0
lr_actor: 0.0003
lr_critic: 0.0003
lr_trans: 0.0003
max_grad_norm: 0.5
minibatch_size: 64
n_steps: 256
normalize_advantage: true
normalize_obs: true
normalize_reward: true
normalizer_freeze_after: 100000
num_envs: 8
probe_states: 256
step_by_step: false
switch: 614400
target_kl: null
tasks:
- 1
- -1
total_steps: 3072000
