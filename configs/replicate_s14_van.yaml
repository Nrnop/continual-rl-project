# vanilla on the stage-14 HalfCheetah reward-flip configuration (no boundary reset), keys copied
# unchanged, to reproduce that comparison with the current code. Reward flip, sigma frozen at 0.37,
# anneal_lr off. Transfer matrix and decay probe are off; they do not affect training but cost ~15
# minutes per run.

env_mode: "directional"
transfer_eval_episodes: 0
decay_gain_probe: false

adam_eps: 1.0e-05
agent: vanilla
anneal_lr: false
async_envs: true
clip_coef: 0.2
clip_obs: 10.0
clip_reward: 10.0
critic_hidden_sizes:
- 64
- 64
ent_coef: 0.0
env_id: HalfCheetah-v5
epochs: 10
freeze_log_std: true
gae_lambda: 0.95
gamma: 0.99
hidden_sizes:
- 64
- 64
joint_grad_clip: false
jumpstart_window_updates: 20
log_std_init: -1.0
lr_actor: 0.0003
lr_critic: 0.0003
lr_trans: 0.0003
max_grad_norm: 0.5
minibatch_size: 64
n_steps: 256
normalize_advantage: true
normalize_obs: true
normalize_reward: true
normalizer_freeze_after: 100000
num_envs: 8
probe_states: 256
step_by_step: false
switch: 614400
target_kl: null
tasks:
- 1
- -1
total_steps: 3072000
