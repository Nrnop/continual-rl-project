# SMOOTH LIPSCHITZ DYNAMICS DRIFT — the setting the thesis proposal actually specifies.
#
# Everything else in this study used DirectionalHalfCheetah, where the REWARD flips sign at discrete
# task boundaries. Here the reward is FIXED and the PHYSICS drift continuously: joint damping and
# ground friction are rescaled every step by a smooth multiplier, with no boundaries, no task index
# and no reset signal.
#
#   python -m src_continuous_control.train --agent vanilla --config drift --seed 0
#   python -m src_continuous_control.train --agent pt      --config drift --seed 0
#   python -m src_continuous_control.train --agent ewc     --config drift --seed 0
#
# WHY THIS EXPERIMENT MATTERS. It is the one place a POSITIVE result for PT is still plausible:
#
#   EWC computes its Fisher information AT A TASK BOUNDARY. Under smooth drift there are no
#   boundaries, so on_task_switch is never called, no Fisher is ever accumulated, and EWC
#   DEGENERATES EXACTLY INTO VANILLA. PT's consolidation runs on a TIMER (every k updates) and
#   needs no boundary at all, so its mechanism survives unchanged.
#
# That is precisely the gap the proposal identifies ("most existing methods assume discrete task
# boundaries"), and EWC -- the strongest agent under task switching -- is structurally handicapped
# here while PT is not. NOTE this is a structural prediction, not yet an empirical one: expect
# EWC ~= vanilla by construction, and read any EWC-vanilla difference as seed noise.
#
# SINUSOIDAL, NOT A RAMP. A monotone ramp never revisits earlier physics, so "did the agent retain
# anything?" cannot be answered. The sinusoid returns to dynamics the agent has already seen -- the
# drift analogue of the directional task returning to +1 in phases 3 and 5 -- which is what makes
# retention measurable. period=1228800 over 3072000 steps gives 2.5 full cycles.
#
# LIPSCHITZ BOUND. amplitude 0.5 over period 1228800 with a sinusoid gives
#   max |d(multiplier)/dt| = 0.5 * 2*pi / 1228800 = 2.56e-6 per env step
# i.e. the parameters move by at most ~0.00026% of nominal per step -- smooth by any measure. The
# run prints this at startup, so the proposal's eps is a measured property of the config.
agent: "vanilla"        # overridden by --agent

# --- the drift setting ---
env_mode: "drift"
drift_targets: ["damping", "friction"]   # dof_damping (6 actuated joints) + geom sliding friction
drift_amplitude: 0.5                     # parameters swing over [0.5x, 1.5x] nominal
drift_period: 1228800                    # one full cycle, in GLOBAL env steps
drift_schedule: "sin"                    # "linear" for a never-repeating ramp
drift_phase: 0.0

# --- validated PPO base: IDENTICAL to continual_fast, so drift vs switching is the only change ---
step_by_step: false
normalize_obs: true
normalize_reward: true
clip_obs: 10.0
clip_reward: 10.0
anneal_lr: true
hidden_sizes: [64, 64]
adam_eps: 0.00001
gamma: 0.99
gae_lambda: 0.95
clip_coef: 0.2
ent_coef: 0.0
max_grad_norm: 0.5
target_kl: null
normalize_advantage: true
lr_actor: 0.0003
lr_critic: 0.0003
epochs: 10
minibatch_size: 64
num_envs: 8
async_envs: true
n_steps: 256

# --- PT knobs: TWO FULLY SEPARATE NETWORKS (T_Net / P_Net), as in the reference ---
# NOTE: these runs previously used a shared-trunk / two-linear-head critic. That variant was removed
# as unfaithful to the algorithm being ported — PT_DQN_half.py holds two INDEPENDENT networks. With
# two separate trunks the transfer is a regression and the decay scales parameters, so the operator
# is lossy (FINDINGS.md 6.1). The drift numbers in FINDINGS.md 8 were produced by the removed
# variant and DO NOT correspond to this config; re-run before citing them.
lr_trans: 0.0003
lr_perm: 0.00001
perm_optimizer: "sgd"
k: 10
decay: 0.5
consolidation_epochs: 1
consolidation_buffer_size: 20480
on_switch: "consolidate"   # never fires under drift (no boundaries); consolidation is on the timer

# --- horizon: same as the main sweep, so results are directly comparable ---
total_steps: 3072000
tasks: [1, -1]             # unused under drift; kept so shared config code paths stay valid
switch: 614400             # unused under drift
