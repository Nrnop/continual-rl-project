# PT ablation round 5 — SEPARATE TRUNKS + A PROPERLY TRAINED CONSOLIDATION REGRESSION.
#
# WHY THIS RUN EXISTS. The PT idea needs two things at once: a permanent critic that (a) ACCUMULATES
# knowledge and (b) is INSULATED from the fast timescale. Every configuration tested so far breaks
# one of them:
#   - consolidation disabled (abl_pt_noconsol): insulated, but never learns anything (V_perm stays
#     at its random init), so PT degenerates to vanilla-with-an-offset;
#   - shared trunk (abl_pt_sharedtrunk): accumulates and the transfer is exact, but the permanent
#     head is NOT insulated -- it reads a feature trunk that moves at the fast learning rate;
#   - the shipped separate-trunk config: has both properties in principle, but its consolidation
#     regression is never actually trained (lr_perm=1e-5, SGD, 1 epoch = 320 steps transfers 0.05%
#     of the transient while the decay deletes 100% of it).
# So the configuration that actually embodies the mechanism -- separate trunks WITH a consolidation
# regression that is genuinely optimised -- has never been run. This config runs it, closing the
# obvious objection to the null result.
#
# WHAT CHANGED vs the shipped PT: Adam instead of SGD, lr_perm 1e-5 -> 1e-3, and
# consolidation_epochs 1 -> 20 (6400 gradient steps per consolidation instead of 320).
# decay=0 avoids the separate issue that scaling an MLP's parameters does not scale its output.
#
# EXPECTATION (from the offline measurement in FINDINGS.md 6.3, to be checked against the run):
# a [64,64] permanent net has 5,377 parameters for 20,480 buffered states, so even 200 epochs only
# reached ~29% error on the fitted batch and ~39% on held-out states. The new
# train/consolidation_error_pct metric logs the in-situ value drift per consolidation, so this run
# reports directly how well the transfer works rather than relying on the offline probe.
#
# COST: consolidation adds ~6400 gradient steps per 10 PPO updates (~2x the PPO compute), so expect
# roughly 3x the wall-clock of a normal run.
#
# FULL horizon (3.07M / 5 phases, num_updates=1500) => directly comparable to the main sweep.
#   python -m src_continuous_control.train --agent pt --config abl_pt_trained_consol --seed 0
agent: "pt"

# --- validated PPO base (identical to continual_fast) ---
step_by_step: false
normalize_obs: true
normalize_reward: true
clip_obs: 10.0
clip_reward: 10.0
anneal_lr: true
hidden_sizes: [64, 64]
adam_eps: 0.00001
gamma: 0.99
gae_lambda: 0.95
clip_coef: 0.2
ent_coef: 0.0
max_grad_norm: 0.5
target_kl: null
normalize_advantage: true
lr_actor: 0.0003
epochs: 10
minibatch_size: 64
num_envs: 8
async_envs: true
n_steps: 256

# --- PT critic: separate trunks (the insulated variant), with real consolidation training ---
critic_arch: "separate"
lr_trans: 0.0003
lr_perm: 0.001               # <== was 1e-5
perm_optimizer: "adam"       # <== was sgd
consolidation_epochs: 20     # <== was 1  (6400 grad steps per consolidation)
consolidation_buffer_size: 20480
k: 10
decay: 0.0                   # exact reset; avoids the parameter-vs-output scaling issue
on_switch: "consolidate"

# --- full continual experiment: 5 phases / 4 switches (+,-,+,-,+) ---
tasks: [1, -1]
switch: 614400
total_steps: 3072000
