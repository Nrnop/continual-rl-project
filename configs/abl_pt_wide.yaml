# ABLATION: pt_paper but with FULL-WIDTH critics — i.e. PT-2x instead of PT-0.5x.
#
# Identical to configs/pt_paper.yaml in every respect except `critic_hidden_sizes`. Read that file
# for the rationale behind every other setting.
#
# WHY THIS EXISTS. On the stationary gate (1M steps, no switching, 8 seeds) vanilla turned out to be
# BIMODAL — 6 seeds settle at ~1300 and 2 seeds find a much better gait at ~3500 — while PT-0.5x
# was unimodal:
#
#   vanilla  1128 1244 1276 1276 1431 1496 | 3450 3608     high mode 2/8
#   pt-0.5x  1016 1045 1236 1329 1391 1402 1417 1434       high mode 0/8
#
# PT matches vanilla's MODAL outcome to within 25 points (1284 vs 1308), so the old implementation
# defect is gone. But it never reaches the high mode. Two explanations are confounded there:
#
#   (a) the DECOMPOSITION caps the ceiling — splitting the value function constrains it; or
#   (b) the per-component WIDTH caps it — PT-0.5x's two [43,43] nets each represent a narrower
#       function class than vanilla's single [64,64], even though the TOTAL parameter count is
#       matched (5 420 vs 5 377).
#
# This config tests (b): each critic at the full [64,64], so PT has ~2x vanilla's critic
# parameters. If the high mode returns, the cap was width. If it does not, the cap is the
# decomposition itself — which would be a mechanism-level result, and one visible with no
# non-stationarity present at all.
#
# NOTE this arm is deliberately NOT parameter-matched, so it cannot be used as the headline PT
# result (Sec. 6.1 / App. C.3 — capacity parity is a precondition for the comparison to be about
# the decomposition). It is a control, not a contender.
#
#   python -m src_continuous_control.train --agent pt --config abl_pt_wide --seed 0 \
#       --total-steps 1000000 --disable-task-switch

agent: "pt"

step_by_step: false
normalize_obs: true
normalize_reward: true
clip_obs: 10.0
clip_reward: 10.0
anneal_lr: false
hidden_sizes: [64, 64]
adam_eps: 0.00001
gamma: 0.99
gae_lambda: 0.95
clip_coef: 0.2
ent_coef: 0.0
max_grad_norm: 0.5
target_kl: null
normalize_advantage: true
lr_actor: 0.0003
epochs: 10
minibatch_size: 64
num_envs: 8
async_envs: true
n_steps: 256

critic_hidden_sizes: [64, 64]   # <== THE ONLY DIFFERENCE from pt_paper.yaml ([43, 43] there)
lr_trans: 0.0003
lr_perm: 0.00001
perm_optimizer: "sgd"
k: 24
decay: 0.75
consolidation_epochs: 1
consolidation_buffer_size: 49152
value_preserving_consolidation: false
on_switch: "consolidate"

jumpstart_window_updates: 20
probe_states: 256

tasks: [1, -1]
switch: 614400
total_steps: 3072000
