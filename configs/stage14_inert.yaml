# STAGE 14 -- Stage 12 repeated at a NORMAL exploration level.
# Stage 12 froze log_std at its default init of 0 (sigma = 1.0), which is very heavy noise
# for HalfCheetah: every arm landed at -416 to -579 against 1500-3900 in the earlier jobJ
# runs. Freezing was required for fairness (pt_full freezes sigma by C4 while vanilla
# learns it), so the COMPARISON was valid but the operating point was not representative.
# log_std_init = -1.0 (sigma ~ 0.37) sits between vanilla's learned endpoint (0.084) and
# EWC's (0.140) on this domain, so all arms run at a sane exploration level.
# ARM: frozen
env_id: HalfCheetah-v5
tasks:
- 1
- -1
switch: 614400
total_steps: 3072000
step_by_step: false
num_envs: 8
async_envs: true
n_steps: 256
epochs: 10
minibatch_size: 64
gamma: 0.99
gae_lambda: 0.95
clip_coef: 0.2
ent_coef: 0.0
max_grad_norm: 0.5
target_kl: null
normalize_advantage: true
anneal_lr: false
adam_eps: 1.0e-05
lr_actor: 0.0003
lr_critic: 0.0003
lr_trans: 0.0003
normalize_obs: true
normalize_reward: true
normalizer_freeze_after: 100000
clip_obs: 10.0
clip_reward: 10.0
freeze_log_std: true
jumpstart_window_updates: 20
probe_states: 256
joint_grad_clip: false
agent: pt_full
hidden_sizes:
- 51
- 51
critic_hidden_sizes:
- 51
- 51
trans_hidden_sizes:
- 32
- 32
actor_trans_hidden_sizes:
- 32
- 32
critic_trans_hidden_sizes:
- 32
- 32
rho: 0.5
k: 8
consolidation_epochs: 2
consolidation_buffer_size: 16384
kl_prior_coef: 0.01
lr_perm: 0.0
lr_perm_actor: 0.0
rm_power: 0.6
rm_power_actor: 0.6
log_std_init: -1.0
