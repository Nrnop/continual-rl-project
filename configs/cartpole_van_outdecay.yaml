# Control: vanilla PPO on cartpole-swingup with its output layers halved every 10 updates and at
# each boundary (Adam state cleared), as the frozen-permanent pt arm does to its transient. See
# PPOVanilla._decay_outputs. Otherwise identical to cartpole_van.yaml.

env_mode: "cartpole"
cartpole_task: "swingup"  # fallbacks if this saturates: "swingup_sparse", "two_poles"

# Same task sequence as default.yaml. Tasks 1/3 and 2/4 share physics, so backward transfer is
# defined. A longer, heavier pole is harder to swing up.
drift_schedule: "step"
drift_targets: ["pole_length", "pole_mass"]
task_multipliers: [1.0, 1.6, 0.6, 1.6, 0.6]

# Sigma frozen at exp(-1) = 0.37 and matched across arms. On HalfCheetah learned sigma collapses at
# different rates per arm, which confounds the comparison. 0.37 is not tuned for cartpole.
freeze_log_std: true
log_std_init: -1.0

hidden_sizes: [64, 64]

# Episodes are exactly 1000 steps with no early termination, so the maximum return is 1000.
# Changing this changes the ceiling.
max_episode_steps: 1000

# Halve the output layers every 10 PPO updates.
output_decay_every: 10
output_decay_factor: 0.5
