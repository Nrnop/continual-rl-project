# STAGE 18 -- HALFCHEETAH AT THE SUPERVISOR'S EXACT PUBLISHED CONFIGURATION (PT_full.md).
# Our stage 14 used k=8, consolidation_epochs=2 and parameter-parity widths. This arm uses
# his PT-B row verbatim -- k=16, consolidation_epochs=3, hidden [256,256], trans [64,64],
# lr_perm = lr_perm_actor = 3e-4, rho 0.5, kl_prior_coef 0.01, rm_power 0.6 -- so the
# reduction is tested against the configuration he actually reports, not ours.
#
# NOTE ON PARITY: his widths give pt_full ~4x vanilla's parameter count (four nets vs two).
# That is a capacity advantage for PT, kept deliberately here because this is a FIDELITY
# run. stage14 is the parity-controlled comparison; read the two together.
#
# log_std is frozen at -1.0 on EVERY arm: pt_full freezes it by Constraint C4 while vanilla
# learns it, and on HalfCheetah that gap alone is worth more than the effect under test.
# ARM: vanilla PPO baseline
env_id: HalfCheetah-v5
tasks:
- 1
- -1
switch: 614400
total_steps: 3072000
step_by_step: false
num_envs: 8
async_envs: true
n_steps: 256
epochs: 10
minibatch_size: 64
gamma: 0.99
gae_lambda: 0.95
clip_coef: 0.2
ent_coef: 0.0
max_grad_norm: 0.5
target_kl: null
normalize_advantage: true
anneal_lr: false
adam_eps: 1.0e-05
lr_actor: 0.0003
lr_critic: 0.0003
lr_trans: 0.0003
normalize_obs: true
normalize_reward: true
normalizer_freeze_after: 100000
clip_obs: 10.0
clip_reward: 10.0
freeze_log_std: true
jumpstart_window_updates: 20
probe_states: 256
joint_grad_clip: false
agent: vanilla
hidden_sizes:
- 64
- 64
critic_hidden_sizes:
- 64
- 64
log_std_init: -1.0
