# vanilla PPO on cartpole-swingup, with task boundaries.
#
# Generated by scripts/make_multienv_configs.py, do not edit by hand. Edit the script and
# regenerate.
#
#   python -m src_continuous_control.train --agent vanilla --config multienv_cartpole_swingup_vanilla --seed 0
#
# Environment: cartpole-swingup, 1 motor(s), 5 observations.
# Scaled at each boundary: pole_length, pole_mass
#   (the pole is the body, so its length and mass set the control problem)
#
# The return ceiling is 1000: reward is in [0,1] per step over exactly 1000 steps with no early
# termination, so a return reads as a percentage of optimal.
#
# The pt widths are the same as in configs/cartpole_pt.yaml, so these runs are comparable with the
# standalone cartpole-swingup runs.

env_mode: "dmc"
dmc_env: "cartpole-swingup"

# Same schedule and multipliers across the family; environments differ only in which
# physics parameters are scaled.
drift_schedule: "step"
drift_targets: ["pole_length", "pole_mass"]
task_multipliers: [1.0, 1.6, 0.6, 1.6, 0.6]

# Exactly 1000 steps with no early termination; the 1000 ceiling depends on it.
max_episode_steps: 1000

# Exploration: learned log_std starting at sigma = 1.0 (CleanRL's ppo_continuous_action, as in
# DART). Set in every arm's overlay so all arms share it; preflight checks the realised value.
freeze_log_std: false
log_std_init: 0.0

# Widths
# The baseline; pt's widths are matched against this total.
# Measured at obs 5 / act 1: 9,219 parameters in total.
hidden_sizes: [64, 64]
