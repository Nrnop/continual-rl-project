# Inert-permanent control for the ASYMMETRIC task set.
#
# Identical to configs/pt_paper_asym.yaml except lr_perm (2e-4 -> 1e-5, i.e. the permanent is
# switched off: it transfers ~0.04% per consolidation and never leaves its initialisation).
#
# This is the fourth cell of the 2x2 that closes the study:
#
#                        | permanent WORKING      | permanent DEAD
#     -------------------+------------------------+------------------------
#     symmetric  [1,-1]  | pt_paper               | abl_pt_inert
#     asymmetric [1,-0.5]| pt_paper_asym          | abl_pt_inert_asym   <- this file
#
# The symmetric row asks "does a working permanent help?"; the asymmetric row asks the same thing
# in the regime where Theorem 5's fixed point E_tau[v_tau] is NON-DEGENERATE. Under the symmetric
# flip E_tau[r_tau] = ctrl and the permanent has nothing to store by construction, so the row
# comparison isolates whether that degeneracy is what has been suppressing the effect.
#
#   python -m src_continuous_control.train --agent pt --config abl_pt_inert_asym --seed 0

agent: "pt"

step_by_step: false
normalize_obs: true
normalize_reward: true
clip_obs: 10.0
clip_reward: 10.0
anneal_lr: false
hidden_sizes: [64, 64]
adam_eps: 0.00001
gamma: 0.99
gae_lambda: 0.95
clip_coef: 0.2
ent_coef: 0.0
max_grad_norm: 0.5
target_kl: null
normalize_advantage: true
lr_actor: 0.0003
lr_critic: 0.0003
epochs: 10
minibatch_size: 64
num_envs: 8
async_envs: true
n_steps: 256

critic_hidden_sizes: [43, 43]
lr_trans: 0.0003
lr_perm: 0.00001           # <== THE ONLY DIFFERENCE from pt_paper_asym.yaml (2e-4 there)
perm_optimizer: "sgd"
alpha_p_rm_power: 0.6
joint_grad_clip: false
k: 24
decay: 0.75
consolidation_epochs: 1
consolidation_buffer_size: 49152
value_preserving_consolidation: false
on_switch: "consolidate"

jumpstart_window_updates: 20
probe_states: 256

tasks: [1.0, -0.5]         # asymmetric: E_tau[r_tau] no longer cancels
switch: 614400
total_steps: 3072000
