# `pt` ablation, permanent frozen on reacher-easy, with task boundaries.
#
# Generated by scripts/make_multienv_configs.py, do not edit by hand. Edit the script and
# regenerate.
#
#   python -m src_continuous_control.train --agent pt --config multienv_reacher_easy_pt_frozen --seed 0
#
# Environment: reacher-easy, 2 motor(s), 6 observations.
# Scaled at each boundary: arm_length, arm_mass
#   (the arm is the body; the direct analogue of the pole, with no balance and no gait)
#
# The return ceiling is 1000: reward is in [0,1] per step over exactly 1000 steps with no early
# termination, so a return reads as a percentage of optimal.
#
# reacher stores its goal in the model, so a physics rebuild would move the target mid-episode.
# envs/dm_control_drift.py preserves it (see tests/test_dmc_drift_env.py).

env_mode: "dmc"
dmc_env: "reacher-easy"

# Same schedule and multipliers across the family; environments differ only in which
# physics parameters are scaled.
drift_schedule: "step"
drift_targets: ["arm_length", "arm_mass"]
task_multipliers: [1.0, 1.6, 0.6, 1.6, 0.6]

# Exactly 1000 steps with no early termination; the 1000 ceiling depends on it.
max_episode_steps: 1000

# Exploration: learned log_std starting at sigma = 1.0 (CleanRL's ppo_continuous_action, as in
# DART). Set in every arm's overlay so all arms share it; preflight checks the realised value.
freeze_log_std: false
log_std_init: 0.0

# Widths, derived for obs 6 / act 2.
#
# pt has four networks to the baseline's two, so parity depends on the input and output
# dimensions. Parameter totals, counted on constructed modules:
#
#   vanilla / ewc  [64,64]                   total     9,413   1.0000x
#   pt  perm [54,54] + trans [31,31]  total     9,377   0.9962x
#   pt  perm [51,51] + trans [32,32]   (the HalfCheetah widths)  0.939x  <- a 6% handicap
#
# The permanent is near baseline width and the transient about half (the paper's
# PT-0.5x), within 0.5% of the baseline's parameter count. PPO's gradient reaches only
# the transient (mu_P is detached), so the trainable count is below the total; preflight
# prints both.
hidden_sizes: [54, 54]                  # permanent actor
actor_trans_hidden_sizes: [31, 31]      # transient actor, about half width
critic_hidden_sizes: [54, 54]           # permanent critic
critic_trans_hidden_sizes: [31, 31]     # transient critic, about half width

# Ablation: the permanent's learning is off.
#   vanilla  -> this arm: what the split itself adds (transient, decay, KL anchor to a fixed
#                         permanent)
#   this arm -> pt:       what the permanent's learning adds
#
# lr_perm = 0 stops only the permanent's learning; the transient decay, the consolidation cadence
# and the KL anchor still run. Check that the realised `actor_absorbed_frac` is about 0 here and
# not in pt. Report this arm's return beside any retention metric, since retention improves when
# an agent learns less.
lr_perm: 0.0
lr_perm_actor: 0.0

# Robbins-Monro annealing of a zero learning rate is a no-op, so it is turned off.
rm_power: 0.0
rm_power_actor: 0.0
