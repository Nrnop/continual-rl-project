# STAGE 4 -- SMOOTH DRIFT. The continuity type never tested: dynamics drift continuously
# (sinusoidal drag, period 80k over 360k steps = 4.5 cycles) with NO task boundaries.
# EWC computes its Fisher AT a boundary, so with none it never accumulates one and
# degenerates structurally into vanilla. PT consolidates on a TIMER and is unaffected.
# This is PT's strongest remaining case and what the thesis proposal actually specified.
# ARM: ewc
env_mode: point_drift
point_target: 0.0
point_dt: 0.1
point_base_drag: 0.35
point_action_scale: 1.0
point_position_limit: 2.0
point_velocity_limit: 2.0
max_episode_steps: 200
drift_amplitude: 0.75
drift_period: 80000
drift_schedule: sin
drift_phase: 0.0
step_by_step: false
num_envs: 4
async_envs: false
n_steps: 256
epochs: 4
minibatch_size: 64
hidden_sizes:
- 64
- 64
critic_hidden_sizes:
- 64
- 64
trans_hidden_sizes:
- 32
- 32
actor_trans_hidden_sizes:
- 32
- 32
critic_trans_hidden_sizes:
- 32
- 32
normalize_obs: true
normalize_reward: true
normalizer_freeze_after: 60000
clip_obs: 10.0
clip_reward: 10.0
lr_actor: 0.0003
lr_critic: 0.0003
ent_coef: 0.0
target_kl: null
anneal_lr: false
total_steps: 360000
switch: 100000
eval_interval_updates: 5
no_eval: true
rho: 0.5
k: 8
consolidation_epochs: 2
consolidation_buffer_size: 8192
lr_trans: 0.0003
lr_perm: 0.001
lr_perm_actor: 0.001
rm_power: 0.6
rm_power_actor: 0.6
kl_prior_coef: 0.01
agent: ewc
freeze_log_std: true
