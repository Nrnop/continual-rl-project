# Ablation for the reward-flip study: pt with the permanent frozen (lr_perm = 0). This disables the
# permanent's learning, not the decay. Only one --config overlay is applied, so this repeats
# reward_flip.yaml; keep it in sync.

reset_on_task_switch: true
env_mode: "directional"
tasks: [1, -1]
transfer_eval_episodes: 0

lr_perm: 0.0
lr_perm_actor: 0.0

# Annealing a zero learning rate is a no-op; rm_power is 0 so the log does not show a schedule.
rm_power: 0.0
rm_power_actor: 0.0
