# `pt` (split actor + split critic) on walker-stand -- the multi-environment family study.
#
# GENERATED by scripts/make_multienv_configs.py. Edit that script and regenerate; editing this
# file by hand breaks the symmetry the family depends on, because 24 overlays must agree in every
# key except the one under test.
#
#   cd "e:/update-single task + videos"
#   python -m src_continuous_control.train --agent pt --config multienv_walker_stand_pt --seed 0
#
# ENVIRONMENT: walker-stand, 6 motor(s), 24 observations.
# WHAT CHANGES AT A BOUNDARY: limb_mass, ground_friction
#   -- legged locomotion; walker's joint damping is only 0.1 and would be immeasurable at 0.6-1.6x, so limb mass carries the change. The torso is deliberately left alone, so the MASS DISTRIBUTION changes rather than the whole body scaling self-similarly
#
# CEILING IS 1000 BY CONSTRUCTION. dm_control's reward is in [0,1] per step over exactly 1000 steps
# with no early termination, so every return here reads as a percentage of optimal and returns
# average across the family with no fudge factor. Report the percentage, not just the raw number.
#
# Half of the study's one controlled comparison. Identical to walker-walk in every key except the
# task name -- see that file.

env_mode: "dmc"
dmc_env: "walker-stand"

# Same schedule and multipliers as the rest of the family, deliberately: environments
# should differ in the ENVIRONMENT and, where unavoidable, in which physics parameter is
# scaled -- never in the schedule.
drift_schedule: "step"
drift_targets: ["limb_mass", "ground_friction"]
task_multipliers: [1.0, 1.6, 0.6, 1.6, 0.6]

# The episode is exactly 1000 steps and never terminates early. Do not change without
# also changing the reported ceiling.
max_episode_steps: 1000

# --- EXPLORATION: STANDARD PPO, LEARNED, AND MATCHED ACROSS ALL THREE ARMS ---
# log_std is a trainable parameter starting at sigma = 1.0, which is CleanRL's ppo_continuous_action
# and what the DART paper uses on these same environments. It is stated explicitly in every arm's
# overlay rather than inherited, so no arm can quietly run a different exploration schedule -- that
# confound once handed one arm 3x the exploration of the others and produced a fake result.
# preflight asserts the REALISED log_std off live tensors, not this key.
freeze_log_std: false
log_std_init: 0.0

# --- WIDTHS: RE-DERIVED FOR obs 24 / act 6. HalfCheetah's DO NOT TRANSFER. ---
#
# `pt` has four networks where the baseline has two, so parity depends on the input and
# output dimensions. Measured on constructed modules, not computed from a formula:
#
#   vanilla / ewc  [64,64]                   total    11,981   1.0000x
#   pt  perm [53,53] + trans [28,28]  total    11,985   1.0003x
#   pt  perm [51,51] + trans [32,32]   (the shipped HalfCheetah widths)  1.0155x <- an ADVANTAGE, on the study's cleanest comparison
#
# This keeps the paper's PT-0.5x construction -- a permanent near baseline width and a
# transient at about half -- while landing within 0.5% of the baseline's parameter count.
#
# ALSO REPORT THE TRAINABLE SPLIT. PPO's gradient reaches only the transient (`mu_P` is
# detached in the training forward); the permanent moves by the consolidation regression
# instead. Parity is matched on TOTALS, which count a network PPO never touches, and on
# HalfCheetah that asymmetry became a documented finding. preflight prints both.
hidden_sizes: [53, 53]                  # permanent actor
actor_trans_hidden_sizes: [28, 28]      # transient actor  -- about half width
critic_hidden_sizes: [53, 53]           # permanent critic
critic_trans_hidden_sizes: [28, 28]     # transient critic -- about half width
