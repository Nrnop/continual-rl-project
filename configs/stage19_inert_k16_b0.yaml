# STAGE 19 -- what closes the k=16 gap? At k=8 the inert arm and PPO + shrinkage matched
# exactly (93.4 vs 93.9). At k=16 they diverge (93.9 vs 73.9). The inert arm has two things
# the shrink-only control does not: it also shrinks the CRITIC's transient, and it carries the KL
# anchor. This isolates the anchor -- if beta=0 drops the inert arm to ~74, the anchor is
# what the periodic shrinkage is missing at this frequency; if it stays at ~94, it is the critic.
# ARM: inert, k=16, KL anchor OFF
env_mode: point_tasks
point_target_magnitude: 2.0
point_dt: 0.1
point_drag: 0.35
point_action_scale: 1.0
point_position_limit: 3.0
point_velocity_limit: 3.0
point_ctrl_cost_weight: 0.01
max_episode_steps: 150
tasks:
- 0.625
- -0.625
total_steps: 360000
switch: 40000
step_by_step: false
num_envs: 4
async_envs: false
n_steps: 256
epochs: 4
minibatch_size: 64
hidden_sizes:
- 64
- 64
critic_hidden_sizes:
- 64
- 64
trans_hidden_sizes:
- 32
- 32
actor_trans_hidden_sizes:
- 32
- 32
critic_trans_hidden_sizes:
- 32
- 32
normalize_obs: true
normalize_reward: true
normalizer_freeze_after: 60000
clip_obs: 10.0
clip_reward: 10.0
lr_actor: 0.0003
lr_critic: 0.0003
ent_coef: 0.0
target_kl: null
anneal_lr: false
eval_interval_updates: 4
no_eval: false
rho: 0.5
k: 16
consolidation_epochs: 3
consolidation_buffer_size: 16384
lr_trans: 0.0003
lr_perm: 0.0
lr_perm_actor: 0.0
rm_power: 0.6
rm_power_actor: 0.6
kl_prior_coef: 0.0
agent: pt_full
