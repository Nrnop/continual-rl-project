# STAGE 16 -- CAN THE PERMANENT WIN? Linear monotone drift, permanent decoupled from decay.
#
# Stage 15 (linear drift, rho=0.5) was the ONLY regime where the signs invert:
#     shrinkage (frozen - van) = -18.6  p=0.000    <- the shrinkage HURTS here
#     mechanism (live - frozen) = +8.2  p=0.010    <- the permanent HELPS here
# but both arms still lost to vanilla (126.1), because rho couples the two: you cannot
# have the permanent without also paying for the shrinkage.
#
# `decay_rho` (new) breaks that coupling. Two ways to weaken the shrinkage:
#   r05 / r15   small rho -- weak shrinkage AND slow absorption, still composition-preserving
#   decoup      rho=0.5 with decay_rho=0 -- permanent absorbs at full rate, transient is
#               NEVER shrunk. Not preserving (V jumps by rho*V_T each cycle); watch for
#               divergence, that overshoot is the legacy keep=1 behaviour.
#
# THE TEST: does any pt arm beat VANILLA (126.1)? If so the mechanism wins on its own
# merits, in the regime the proposal specified, against a fair baseline.
# inert_decoup is the sanity control -- no permanent AND no shrinkage should ~= vanilla.
# ARM: pt_r15 -> {'rho': 0.15}
env_mode: point_drift
point_target: 0.0
point_dt: 0.1
point_base_drag: 0.35
point_action_scale: 1.0
point_position_limit: 2.0
point_velocity_limit: 2.0
max_episode_steps: 200
drift_amplitude: 0.5
drift_period: 360000
drift_schedule: linear
drift_phase: 0.0
step_by_step: false
num_envs: 4
async_envs: false
n_steps: 256
epochs: 4
minibatch_size: 64
hidden_sizes:
- 64
- 64
critic_hidden_sizes:
- 64
- 64
trans_hidden_sizes:
- 32
- 32
actor_trans_hidden_sizes:
- 32
- 32
critic_trans_hidden_sizes:
- 32
- 32
normalize_obs: true
normalize_reward: true
normalizer_freeze_after: 60000
clip_obs: 10.0
clip_reward: 10.0
lr_actor: 0.0003
lr_critic: 0.0003
ent_coef: 0.0
target_kl: null
anneal_lr: false
total_steps: 360000
switch: 100000
eval_interval_updates: 5
no_eval: true
rho: 0.15
k: 8
consolidation_epochs: 2
consolidation_buffer_size: 8192
lr_trans: 0.0003
lr_perm: 0.001
lr_perm_actor: 0.001
rm_power: 0.6
rm_power_actor: 0.6
kl_prior_coef: 0.01
agent: pt_full
point_target_amplitude: 3.0
