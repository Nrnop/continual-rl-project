# `pt` (split actor + split critic) on cartpole-swingup -- Lipschitz2 - a slow trend PLUS a fast fluctuation.
#
# GENERATED by scripts/make_multienv_configs.py. Edit that script and regenerate.
#
#   cd "e:/update-single task + videos"
#   python -m src_continuous_control.train --agent pt --config multienv_lipschitz2_cartpole_swingup_pt --seed 0
#
# ENVIRONMENT: cartpole-swingup, 1 motor(s), 5 observations.
# WHAT DRIFTS: pole_length, pole_mass
#   -- the pole IS the body, and it is the parameter the 95 committed cartpole runs used
#
# The same slow tide at a slightly smaller amplitude, plus a ripple completing ~100 cycles across
# the run. This is the world that gives pt's fast network something to do, and the one where pt
# was significant on cartpole in DRIFT_RESULTS.md.
#
# THERE ARE NO TASK BOUNDARIES HERE. The physics move every step on a sine schedule; there is no
# task index, no switch and no reset signal. This is the setting the thesis proposal specifies.
#
# CEILING IS 1000 BY CONSTRUCTION -- reward in [0,1] over exactly 1000 steps, no early termination.

env_mode: "dmc"
dmc_env: "cartpole-swingup"

# The same physics parameters this environment uses in the boundary study, so the two
# settings can be read against each other rather than being two different experiments.
drift_targets: ["pole_length", "pole_mass"]

# --- the drift schedule. These numbers are COPIED FROM DRIFT_RESULTS.md and must not be
# "improved": cartpole-swingup appears in both studies, so identical settings make its
# cell here a free replication of an existing result. ---
drift_schedule: "sin"
drift_amplitude: 0.4          # slow structural component: the permanent's job
drift_period: 1228800       # one slow cycle in GLOBAL env steps (~2.5 cycles per run)
drift_amplitude2: 0.2         # fast fluctuation: the transient's job
drift_period2: 30720          # ~15 PPO updates per fast cycle
drift_phase: 0

# --- NO BOUNDARIES, so no transfer matrix ---
# FWT and BWT are indexed by task number, which does not exist here. This setting measures RETURN
# ONLY: the carry-over-vs-advantage plot cannot be reproduced for drift, and neither can forward or
# backward transfer. That is a property of the setting, not an omission.
transfer_eval_episodes: 0

# ONLINE EWC CANNOT RUN HERE WITHOUT THIS. EWC normally strengthens its protection at a task
# boundary; there are none, so without a timer it never accumulates a Fisher, the penalty is
# identically zero, and the EWC arm is vanilla PPO wearing a different name.
ewc_consolidate_every: 10

# Off, and it matters more here than anywhere: anneal_lr decays every learning rate toward zero,
# which is fatal in a drift experiment whose entire point is continuous adaptation. An archived
# HalfCheetah drift study was made unusable by leaving it on.
anneal_lr: false

# How far the multiplier must move before the MJCF is recompiled. 0.005 is what DRIFT_RESULTS.md
# used -- 0.4% of the drift range -- so the drift is a fine staircase rather than a true continuum.
# It is a cost, not a confound: every arm shares the same environment.
dmc_reload_tol: 0.005

max_episode_steps: 1000

# --- EXPLORATION: STANDARD PPO, LEARNED, AND MATCHED ACROSS ALL THREE ARMS ---
# log_std is a trainable parameter starting at sigma = 1.0, which is CleanRL's ppo_continuous_action
# and what the DART paper uses on these same environments. It is stated explicitly in every arm's
# overlay rather than inherited, so no arm can quietly run a different exploration schedule -- that
# confound once handed one arm 3x the exploration of the others and produced a fake result.
# preflight asserts the REALISED log_std off live tensors, not this key.
freeze_log_std: false
log_std_init: 0.0

# --- WIDTHS: RE-DERIVED FOR obs 5 / act 1. HalfCheetah's DO NOT TRANSFER. ---
#
# `pt` has four networks where the baseline has two, so parity depends on the input and
# output dimensions. Measured on constructed modules, not computed from a formula:
#
#   vanilla / ewc  [64,64]                   total     9,219   1.0000x
#   pt  perm [55,55] + trans [30,30]  total     9,215   0.9996x
#   pt  perm [51,51] + trans [32,32]   (the shipped HalfCheetah widths)  0.931x  <- a 7% handicap
#
# This keeps the paper's PT-0.5x construction -- a permanent near baseline width and a
# transient at about half -- while landing within 0.5% of the baseline's parameter count.
#
# ALSO REPORT THE TRAINABLE SPLIT. PPO's gradient reaches only the transient (`mu_P` is
# detached in the training forward); the permanent moves by the consolidation regression
# instead. Parity is matched on TOTALS, which count a network PPO never touches, and on
# HalfCheetah that asymmetry became a documented finding. preflight prints both.
hidden_sizes: [55, 55]                  # permanent actor
actor_trans_hidden_sizes: [30, 30]      # transient actor  -- about half width
critic_hidden_sizes: [55, 55]           # permanent critic
critic_trans_hidden_sizes: [30, 30]     # transient critic -- about half width
