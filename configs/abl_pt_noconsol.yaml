# PT ablation round 4 — NO CONSOLIDATION (the causal control).
#
# Measured root cause: at lr_perm=1e-5 / SGD / 1 epoch, consolidation transfers only 0.05% of the
# transient into the permanent while the decay wipes 100% of it — so the acting value V loses ~98%
# of its magnitude every k=10 updates (~150x per run). The next rollout then feeds those gutted
# values to GAE, corrupting the advantages. Not tunable away: the shock floors at ~33% even with
# 50 consolidation epochs, because V_perm must represent old_V_perm + V_trans — the SUM of two
# [64,64] MLPs — and that function class is not closed under addition (widening helps: 35% -> 22%
# @[256,256] -> 17% @[512,512], but never reaches 0). In the original PT paper's tabular/linear
# setting that sum IS exactly representable, which is why consolidation works there and not here.
#
# THIS RUN DISABLES CONSOLIDATION ENTIRELY (k huge + on_switch none). It is the causal control:
#   - If PT now tracks vanilla  -> consolidation is PROVEN to be the destroyer (diagnosis confirmed).
#   - If PT still collapses     -> something else is also at fault; the diagnosis is incomplete.
# Note what PT reduces to here: V_perm is never trained (it only ever updates during consolidation),
# so it stays at its random init and V_trans fits returns minus that fixed offset — i.e. effectively
# a single critic. Behaving like vanilla is exactly the expected outcome.
#
# FULL horizon (3.07M / 5 phases, num_updates=1500) => directly comparable to the main sweep.
#   python -m src_continuous_control.train --agent pt --config abl_pt_noconsol --seed 0
agent: "pt"

# --- validated PPO base (identical to continual_fast) ---
step_by_step: false
normalize_obs: true
normalize_reward: true
clip_obs: 10.0
clip_reward: 10.0
anneal_lr: true
hidden_sizes: [64, 64]
adam_eps: 0.00001
gamma: 0.99
gae_lambda: 0.95
clip_coef: 0.2
ent_coef: 0.0
max_grad_norm: 0.5
target_kl: null
normalize_advantage: true
lr_actor: 0.0003
epochs: 10
minibatch_size: 64
num_envs: 8
async_envs: true
n_steps: 256

# --- PT critic knobs ---
lr_trans: 0.0003
lr_perm: 0.00001
perm_optimizer: "sgd"
k: 1000000                  # <== ABLATION VARIABLE: never reached in 1500 updates => no periodic consolidation
on_switch: "none"           # <== and no boundary-triggered consolidation either
decay: 0.0                  # (irrelevant: the decay only runs inside _consolidate, which never fires)
consolidation_epochs: 1
consolidation_buffer_size: 20480   # deque maxlen keeps memory bounded even though it never drains

# --- full continual experiment: 5 phases / 4 switches (+,-,+,-,+) ---
tasks: [1, -1]
switch: 614400
total_steps: 3072000
