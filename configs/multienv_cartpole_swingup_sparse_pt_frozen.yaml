# ABLATION ARM: `pt` with the PERMANENT FROZEN on cartpole-swingup_sparse -- the multi-environment family study.
#
# GENERATED by scripts/make_multienv_configs.py. Edit that script and regenerate; editing this
# file by hand breaks the symmetry the family depends on, because 24 overlays must agree in every
# key except the one under test.
#
#   cd "e:/update-single task + videos"
#   python -m src_continuous_control.train --agent pt --config multienv_cartpole_swingup_sparse_pt_frozen --seed 0
#
# ENVIRONMENT: cartpole-swingup_sparse, 1 motor(s), 5 observations.
# WHAT CHANGES AT A BOUNDARY: pole_length, pole_mass
#   -- IDENTICAL to cartpole-swingup except for dm_control's `sparse` flag; the pole, the physics change and the multipliers are the same
#
# CEILING IS 1000 BY CONSTRUCTION. dm_control's reward is in [0,1] per step over exactly 1000 steps
# with no early termination, so every return here reads as a percentage of optimal and returns
# average across the family with no fudge factor. Report the percentage, not just the raw number.
#
# NOT PART OF THE SIX-ENVIRONMENT FAMILY. This is the controlled test of a post-hoc observation
# from it: across the family, `pt` failed to beat vanilla on exactly the two environments with
# BINARY rewards (reacher-easy, ball_in_cup-catch) and won on three of the four with smooth shaped
# rewards. Dense scores four smooth factors so every step pays something; sparse pays 1 only when
# the cart is within +-0.25 of centre AND the pole is within 5.7 degrees of vertical, else 0 -- a
# random policy scores 27.6 on dense and EXACTLY 0.0 on sparse. One variable moved. If `pt`'s
# +10.4% advantage survives here, the reward-density explanation is wrong.

env_mode: "dmc"
dmc_env: "cartpole-swingup_sparse"

# Same schedule and multipliers as the rest of the family, deliberately: environments
# should differ in the ENVIRONMENT and, where unavoidable, in which physics parameter is
# scaled -- never in the schedule.
drift_schedule: "step"
drift_targets: ["pole_length", "pole_mass"]
task_multipliers: [1.0, 1.6, 0.6, 1.6, 0.6]

# The episode is exactly 1000 steps and never terminates early. Do not change without
# also changing the reported ceiling.
max_episode_steps: 1000

# --- EXPLORATION: STANDARD PPO, LEARNED, AND MATCHED ACROSS ALL THREE ARMS ---
# log_std is a trainable parameter starting at sigma = 1.0, which is CleanRL's ppo_continuous_action
# and what the DART paper uses on these same environments. It is stated explicitly in every arm's
# overlay rather than inherited, so no arm can quietly run a different exploration schedule -- that
# confound once handed one arm 3x the exploration of the others and produced a fake result.
# preflight asserts the REALISED log_std off live tensors, not this key.
freeze_log_std: false
log_std_init: 0.0

# --- WIDTHS: RE-DERIVED FOR obs 5 / act 1. HalfCheetah's DO NOT TRANSFER. ---
#
# `pt` has four networks where the baseline has two, so parity depends on the input and
# output dimensions. Measured on constructed modules, not computed from a formula:
#
#   vanilla / ewc  [64,64]                   total     9,219   1.0000x
#   pt  perm [55,55] + trans [30,30]  total     9,215   0.9996x
#   pt  perm [51,51] + trans [32,32]   (the shipped HalfCheetah widths)  0.931x  <- a 7% handicap
#
# This keeps the paper's PT-0.5x construction -- a permanent near baseline width and a
# transient at about half -- while landing within 0.5% of the baseline's parameter count.
#
# ALSO REPORT THE TRAINABLE SPLIT. PPO's gradient reaches only the transient (`mu_P` is
# detached in the training forward); the permanent moves by the consolidation regression
# instead. Parity is matched on TOTALS, which count a network PPO never touches, and on
# HalfCheetah that asymmetry became a documented finding. preflight prints both.
hidden_sizes: [55, 55]                  # permanent actor
actor_trans_hidden_sizes: [30, 30]      # transient actor  -- about half width
critic_hidden_sizes: [55, 55]           # permanent critic
critic_trans_hidden_sizes: [30, 30]     # transient critic -- about half width

# --- THE ABLATION ITSELF: the permanent's LEARNING is off ---
#
# The figure decomposes the method into its two halves:
#   vanilla   -> this arm : what having a SPLIT AT ALL buys (transient, decay, KL anchor to a
#                           permanent that never moves)
#   this arm  -> pt       : what the permanent ACTUALLY LEARNING buys
#
# WHAT THIS DOES AND DOES NOT TURN OFF. `lr_perm = 0` freezes the permanent's LEARNING. It does
# NOT turn off the transient decay, the consolidation cadence, or the KL anchor. A control that was
# not actually off is failure mode #1 in CLAUDE.md, so do not read this key -- assert that this
# arm's realised `actor_absorbed_frac` is ~0 while the live arm's is not.
#
# AND REPORT HOW MUCH THIS ARM LEARNED, ALWAYS. On HalfCheetah the frozen arm scored BWT ~ 0 with a
# peak return of exactly 0.0: every retention metric improves when an agent simply does not learn.
# Here that is easy to state honestly -- report its return as a percentage of 1000.
lr_perm: 0.0
lr_perm_actor: 0.0

# Robbins-Monro annealing of a zero learning rate is a no-op; off, so the log does not advertise a
# schedule that is not running.
rm_power: 0.0
rm_power_actor: 0.0
