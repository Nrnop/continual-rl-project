# DIAGNOSTIC run (not a performance comparison): does the consolidation regression MEMORISE the
# buffer instead of learning a transferable value function?
#
# Round 5 (abl_pt_trained_consol) produced a puzzle: with Adam, lr_perm=1e-3 and 20 consolidation
# epochs, the in-situ consolidation error fell to ~0.0-0.7% -- i.e. the regression fit essentially
# perfectly -- yet PT performed WORSE than every other variant (per-phase means
# 410/-594/-50/-837/-114, collapsing at the FIRST switch instead of the third).
#
# Hypothesis: train/consolidation_error_pct only measures the states the regression just trained on.
# The permanent net memorises the 20 480-state buffer and extrapolates badly onto the NEW states the
# policy visits immediately afterwards -- which is exactly when a task switch has just changed the
# state distribution. Good-looking diagnostics, corrupted acting value where it is actually used.
#
# This run enables consolidation_holdout_frac: 20% of the buffer is EXCLUDED from the regression and
# the same value-drift metric is reported on it as train/consolidation_error_holdout_pct.
#   fitted low + held-out low  -> memorisation hypothesis is WRONG; look elsewhere
#   fitted low + held-out high -> confirmed: the transfer does not generalise off the fitted batch
#
# An offline check with these settings already shows the gap opening with training effort
# (1 epoch: 89.5% fitted / 89.6% held-out;  60 epochs: 24.2% fitted / 53.4% held-out).
#
# Only 3 seeds are needed: this measures a mechanism, not a noisy return difference.
#   python -m src_continuous_control.train --agent pt --config abl_pt_consol_holdout --seed 0
agent: "pt"

# --- identical to abl_pt_trained_consol apart from the holdout ---
step_by_step: false
normalize_obs: true
normalize_reward: true
clip_obs: 10.0
clip_reward: 10.0
anneal_lr: true
hidden_sizes: [64, 64]
adam_eps: 0.00001
gamma: 0.99
gae_lambda: 0.95
clip_coef: 0.2
ent_coef: 0.0
max_grad_norm: 0.5
target_kl: null
normalize_advantage: true
lr_actor: 0.0003
epochs: 10
minibatch_size: 64
num_envs: 8
async_envs: true
n_steps: 256

critic_arch: "separate"
lr_trans: 0.0003
lr_perm: 0.001
perm_optimizer: "adam"
consolidation_epochs: 20
consolidation_buffer_size: 20480
consolidation_holdout_frac: 0.2   # <== 20% of the buffer excluded from the regression, measured separately
k: 10
decay: 0.0
on_switch: "consolidate"

tasks: [1, -1]
switch: 614400
total_steps: 3072000
