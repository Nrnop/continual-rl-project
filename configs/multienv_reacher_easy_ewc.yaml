# Online EWC on reacher-easy -- the multi-environment family study.
#
# GENERATED by scripts/make_multienv_configs.py. Edit that script and regenerate; editing this
# file by hand breaks the symmetry the family depends on, because 24 overlays must agree in every
# key except the one under test.
#
#   cd "e:/update-single task + videos"
#   python -m src_continuous_control.train --agent ewc --config multienv_reacher_easy_ewc --seed 0
#
# ENVIRONMENT: reacher-easy, 2 motor(s), 6 observations.
# WHAT CHANGES AT A BOUNDARY: arm_length, arm_mass
#   -- the arm IS the body; the direct analogue of the pole, with no balance and no gait
#
# CEILING IS 1000 BY CONSTRUCTION. dm_control's reward is in [0,1] per step over exactly 1000 steps
# with no early termination, so every return here reads as a percentage of optimal and returns
# average across the family with no fudge factor. Report the percentage, not just the raw number.
#
# reacher stores its GOAL in the model rather than in the data, so a physics rebuild would move
# the target mid-episode. envs/dm_control_drift.py preserves it; tests/test_dmc_drift_env.py pins
# that the guard is load-bearing.

env_mode: "dmc"
dmc_env: "reacher-easy"

# Same schedule and multipliers as the rest of the family, deliberately: environments
# should differ in the ENVIRONMENT and, where unavoidable, in which physics parameter is
# scaled -- never in the schedule.
drift_schedule: "step"
drift_targets: ["arm_length", "arm_mass"]
task_multipliers: [1.0, 1.6, 0.6, 1.6, 0.6]

# The episode is exactly 1000 steps and never terminates early. Do not change without
# also changing the reported ceiling.
max_episode_steps: 1000

# --- EXPLORATION: STANDARD PPO, LEARNED, AND MATCHED ACROSS ALL THREE ARMS ---
# log_std is a trainable parameter starting at sigma = 1.0, which is CleanRL's ppo_continuous_action
# and what the DART paper uses on these same environments. It is stated explicitly in every arm's
# overlay rather than inherited, so no arm can quietly run a different exploration schedule -- that
# confound once handed one arm 3x the exploration of the others and produced a fake result.
# preflight asserts the REALISED log_std off live tensors, not this key.
freeze_log_std: false
log_std_init: 0.0

# --- widths ---
# Same width as vanilla: EWC is a penalty on the baseline network, not a different
# architecture.
# Measured at obs 6 / act 2: 9,413 parameters in total.
hidden_sizes: [64, 64]
