# Corrected Permanent-Transient PPO: real consolidation on the validated PPO base.
#
# Fixes vs the original PT run:
#   1. batch PPO (step_by_step off) + obs/reward normalization + LR anneal
#      -> removes the deadly-triad divergence that produced critic_loss ~2e5.
#   2. theta_P is updated ONLY by periodic consolidation (ConsolidationBuffer),
#      not by per-step return regression -> removes the double-counting.
#
# Single-task sanity check (should NOT diverge, should learn like vanilla):
#   python -m src_continuous_control.train --agent pt --config pt_fixed \
#       --disable-task-switch --total-steps 1000000 --no-wandb --no-tb
#
# Full continual experiment (directional task switching every `switch` steps):
#   python -m src_continuous_control.train --agent pt --config pt_fixed --no-wandb --no-tb

agent: "pt"

# --- validated PPO base (same knobs as cleanrl_match) ---
step_by_step: false
normalize_obs: true
normalize_reward: true
clip_obs: 10.0
clip_reward: 10.0
anneal_lr: true
hidden_sizes: [64, 64]
adam_eps: 0.00001

# --- vectorized envs: 8 parallel envs x 256 steps = 2048 batch (matches validated recipe);
#     consolidation cadence in env-steps is unchanged (k * n_steps * num_envs = 20480) ---
num_envs: 8
async_envs: true
n_steps: 256
minibatch_size: 64
epochs: 10
gamma: 0.99
gae_lambda: 0.95
clip_coef: 0.2
ent_coef: 0.0
max_grad_norm: 0.5
target_kl: null
normalize_advantage: true

# --- dual-timescale critic ---
lr_actor: 0.0003        # transient actor mean + log_std
lr_trans: 0.0003        # fast transient critic head (theta_T)
lr_perm: 0.00001        # slow permanent critic head (theta_P), SGD
perm_optimizer: "sgd"

# --- consolidation (now actually wired to buffers.ConsolidationBuffer) ---
k: 10                   # consolidate theta_P every k PPO updates
consolidation_epochs: 1
consolidation_buffer_size: 20480   # = k * n_steps (one full consolidation cycle)
decay: 0.5              # theta_T <- decay * theta_T after consolidation (0 = hard reset)

# --- continual task-switching (the real experiment) ---
total_steps: 3072000
switch: 614400
