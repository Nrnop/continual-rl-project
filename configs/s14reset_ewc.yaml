# EWC on the reward-flip benchmark WITH the boundary reset.
#
# Phase 1's stage 14 had no EWC arm, so the shared PPO settings are copied from
# stage14_van.yaml — an identical base to the vanilla arm — and only the agent changes.
# EWC's own knobs come from ppo_ewc.yaml: online Fisher with gamma, textbook penalty,
# lambda 0.0088.
#
# Sigma is FROZEN at log_std_init = -1.0 here, as in every stage-14 arm, so
# `ewc_exclude_log_std` is moot: a frozen log_std carries no gradient and cannot enter the
# Fisher in the first place.
reset_on_task_switch: true
env_mode: "directional"
transfer_eval_episodes: 0
decay_gain_probe: false

adam_eps: 1.0e-05
agent: ewc
anneal_lr: false
async_envs: true
clip_coef: 0.2
clip_obs: 10.0
clip_reward: 10.0
critic_hidden_sizes:
- 64
- 64
ent_coef: 0.0
env_id: HalfCheetah-v5
epochs: 10
freeze_log_std: true
gae_lambda: 0.95
gamma: 0.99
hidden_sizes:
- 64
- 64
joint_grad_clip: false
jumpstart_window_updates: 20
log_std_init: -1.0
lr_actor: 0.0003
lr_critic: 0.0003
lr_trans: 0.0003
max_grad_norm: 0.5
minibatch_size: 64
n_steps: 256
normalize_advantage: true
normalize_obs: true
normalize_reward: true
normalizer_freeze_after: 100000
num_envs: 8
probe_states: 256
step_by_step: false
switch: 614400
target_kl: null
tasks:
- 1
- -1
total_steps: 3072000
