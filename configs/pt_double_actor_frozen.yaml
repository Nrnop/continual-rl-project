# Ablation for pt_double_actor.yaml: the double-actor pt arm (large networks) with the permanent
# frozen (lr_perm = 0), on the four-parameter HalfCheetah physics benchmark (damping, friction,
# mass, armature). This disables the permanent's learning, not the decay. rm_power is 0 because
# annealing a zero learning rate is a no-op.

actor_trans_hidden_sizes:
- 64
- 64
clip_obs: 10.0
clip_reward: 10.0
consolidation_buffer_size: 20480
consolidation_epochs: 3
consolidation_holdout_frac: 0.0
critic_hidden_sizes:
- 256
- 256
critic_trans_hidden_sizes:
- 64
- 64
drift_targets:
- damping
- friction
- mass
- armature
ent_coef: 0.0
hidden_sizes:
- 256
- 256
k: 10
kl_prior_coef: 0.01
lr_actor: 0.0003
lr_perm: 0.0
lr_perm_actor: 0.0
lr_trans: 0.0003
normalize_obs: true
normalize_reward: true
normalizer_freeze_after: 100000
perm_optimizer: adam
rho: 0.5
rm_power: 0.0
rm_power_actor: 0.0
trans_hidden_sizes:
- 64
- 64
