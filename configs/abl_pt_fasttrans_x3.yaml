# PT ablation — FAST-TRANSIENT x3 (lr_trans 3e-4 -> 3e-3).
#
# Same rationale as abl_pt_fasttrans.yaml, pushed 10x above vanilla's critic LR: is MORE transient
# speed better (faster post-switch advantage correction), or does it destabilise the value estimate?
# Brackets the fast-timescale question together with the 1e-3 variant.
#
# FULL horizon (3.07M / 5 phases) so the LR-anneal schedule matches the main sweep exactly.
#   python -m src_continuous_control.train --agent pt --config abl_pt_fasttrans_x3 --seed 0
agent: "pt"

# --- validated PPO base (identical to continual_fast) ---
step_by_step: false
normalize_obs: true
normalize_reward: true
clip_obs: 10.0
clip_reward: 10.0
anneal_lr: true
hidden_sizes: [64, 64]
adam_eps: 0.00001
gamma: 0.99
gae_lambda: 0.95
clip_coef: 0.2
ent_coef: 0.0
max_grad_norm: 0.5
target_kl: null
normalize_advantage: true
lr_actor: 0.0003
epochs: 10
minibatch_size: 64
num_envs: 8
async_envs: true
n_steps: 256

# --- PT critic knobs ---
lr_trans: 0.003             # <== ABLATION VARIABLE (10x vanilla's critic LR; was 3e-4)
lr_perm: 0.00001
perm_optimizer: "sgd"
k: 10
decay: 0.5
consolidation_epochs: 1
consolidation_buffer_size: 20480
on_switch: "consolidate"

# --- full continual experiment: 5 phases / 4 switches (+,-,+,-,+) ---
tasks: [1, -1]
switch: 614400
total_steps: 3072000
