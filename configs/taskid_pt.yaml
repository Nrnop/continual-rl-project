# TASK-AWARE reward flips + reset, sigma 0.37 — pt.
#
# THE ONE CHANGE vs s14reset_pt: a one-hot task label is appended to the observation, so the
# agent is told WHICH task it is in, not merely that a boundary occurred.
#
# Why. Without the label the two tasks demand OPPOSITE actions from identical observations, so the
# policy is asked to be two different functions of one input — a contradiction, not a memory
# problem. Anand & Precup's own control experiment supplies exactly this signal (a feature encoding
# which end of the chain holds the reward), and their transient reads it; that is why their
# transient re-adapts within five episodes of a switch.
#
# EVERY ARM GETS THE LABEL. Giving it to PT alone would hand one arm information the others lack —
# the "config key one agent reads and another ignores" failure this project has already been burnt
# by. What differs per agent is only what the architecture DOES with it (see ppo_pt.yaml comments).
#
# Directly comparable to results/s14reset/pt (6 seeds, same sigma, same reset, no label).
actor_trans_hidden_sizes:
- 32
- 32
adam_eps: 1.0e-05
agent: pt
anneal_lr: false
async_envs: true
clip_coef: 0.2
clip_obs: 10.0
clip_reward: 10.0
consolidation_buffer_size: 16384
consolidation_epochs: 2
critic_hidden_sizes:
- 51
- 51
critic_trans_hidden_sizes:
- 32
- 32
decay_gain_probe: false
ent_coef: 0.0
env_id: HalfCheetah-v5
env_mode: directional
epochs: 10
freeze_log_std: true
gae_lambda: 0.95
gamma: 0.99
hidden_sizes:
- 51
- 51
joint_grad_clip: false
jumpstart_window_updates: 20
k: 8
kl_prior_coef: 0.01
log_std_init: -1.0
lr_actor: 0.0003
lr_critic: 0.0003
lr_perm: 0.0003
lr_perm_actor: 0.0003
lr_trans: 0.0003
max_grad_norm: 0.5
minibatch_size: 64
n_steps: 256
normalize_advantage: true
normalize_obs: true
normalize_reward: true
normalizer_freeze_after: 100000
num_envs: 8
probe_states: 256
reset_on_task_switch: true
rho: 0.5
rm_power: 0.6
rm_power_actor: 0.6
step_by_step: false
switch: 614400
target_kl: null
task_id_obs: true
task_id_to_transient_only: true
tasks:
- 1
- -1
total_steps: 3072000
transfer_eval_episodes: 0
