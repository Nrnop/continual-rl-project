# pt with the permanent frozen (lr_perm = 0) on the HalfCheetah reward-flip benchmark with a reset
# at every boundary, sigma frozen at 0.37. This is the stage-14 HalfCheetah reward-flip
# configuration with one change, reset_on_task_switch: true. Transfer matrix and decay probe are
# off (the matrix is sized from len(tasks) = 2 and would fail at the third boundary).

reset_on_task_switch: true
env_mode: "directional"
transfer_eval_episodes: 0
decay_gain_probe: false

actor_trans_hidden_sizes:
- 32
- 32
adam_eps: 1.0e-05
agent: pt
anneal_lr: false
async_envs: true
clip_coef: 0.2
clip_obs: 10.0
clip_reward: 10.0
consolidation_buffer_size: 16384
consolidation_epochs: 2
critic_hidden_sizes:
- 51
- 51
critic_trans_hidden_sizes:
- 32
- 32
ent_coef: 0.0
env_id: HalfCheetah-v5
epochs: 10
freeze_log_std: true
gae_lambda: 0.95
gamma: 0.99
hidden_sizes:
- 51
- 51
joint_grad_clip: false
jumpstart_window_updates: 20
k: 8
kl_prior_coef: 0.01
log_std_init: -1.0
lr_actor: 0.0003
lr_critic: 0.0003
lr_perm: 0.0
lr_perm_actor: 0.0
lr_trans: 0.0003
max_grad_norm: 0.5
minibatch_size: 64
n_steps: 256
normalize_advantage: true
normalize_obs: true
normalize_reward: true
normalizer_freeze_after: 100000
num_envs: 8
probe_states: 256
rho: 0.5
rm_power: 0.6
rm_power_actor: 0.6
step_by_step: false
switch: 614400
target_kl: null
tasks:
- 1
- -1
total_steps: 3072000
