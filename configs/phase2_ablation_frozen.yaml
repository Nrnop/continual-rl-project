# Ablation: pt with the permanent frozen on the main HalfCheetah benchmark; bar 2 of the ablation
# figure (vanilla -> this arm: what the split buys; this arm -> pt: what permanent learning buys).
#
#  python -m src_continuous_control.train --agent pt --config phase2_ablation_frozen --seed 0 \
#      --results-dir src_continuous_control/results/ablation_frozen

# lr_perm = 0 disables the permanent's learning, not the decay: the transient decay, the
# consolidation cadence and the KL anchor still run. make_phase2_figures.py checks that
# actor_absorbed_frac is ~0 here and not in pt.
lr_perm: 0.0
lr_perm_actor: 0.0

# Annealing a zero learning rate is a no-op; rm_power is 0 so the log does not show a schedule.
rm_power: 0.0
rm_power_actor: 0.0
