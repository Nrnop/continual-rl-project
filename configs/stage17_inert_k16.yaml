# STAGE 17 -- FIDELITY CHECK at the published k. Every dose-response and reduction result
# so far used k=8; PT_full.md specifies k=16 with consolidation_epochs=3. Since the shrink
# FREQUENCY is the mechanism we identified, the reduction has to be re-tested at the published k
# before it can be claimed against the published configuration.
# ARM: inert_k16
env_mode: point_tasks
point_target_magnitude: 2.0
point_dt: 0.1
