point_action_scale: 1.0
point_position_limit: 3.0
point_velocity_limit: 3.0
point_ctrl_cost_weight: 0.01
max_episode_steps: 150
tasks:
- 0.625
- -0.625
total_steps: 360000
switch: 40000
step_by_step: false
num_envs: 4
async_envs: false
n_steps: 256
epochs: 4
minibatch_size: 64
hidden_sizes:
- 64
- 64
critic_hidden_sizes:
- 64
- 64
trans_hidden_sizes:
- 32
- 32
actor_trans_hidden_sizes:
- 32
- 32
critic_trans_hidden_sizes:
- 32
- 32
normalize_obs: true
normalize_reward: true
normalizer_freeze_after: 60000
clip_obs: 10.0
clip_reward: 10.0
lr_actor: 0.0003
lr_critic: 0.0003
ent_coef: 0.0
target_kl: null
anneal_lr: false
eval_interval_updates: 4
no_eval: false
rho: 0.5
k: 16
consolidation_epochs: 3
consolidation_buffer_size: 16384
