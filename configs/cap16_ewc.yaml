# Capacity sweep, small end: EWC at [16,16] on the four-parameter HalfCheetah physics benchmark
# (damping, friction, mass, armature), sigma frozen at 0.37. Identical to cap16_van.yaml except for
# the agent.

hidden_sizes: [16, 16]

decay_gain_probe: false
drift_targets:
- damping
- friction
- mass
- armature
freeze_log_std: true
log_std_init: -1.0
transfer_eval_episodes: 0
