# ROUND 7 (2x2) — isolate the transient DECAY, and test whether stale optimiser state is the
# mechanism behind it.
#
# WHY. Round 6 killed the memorisation hypothesis: consolidation is near-exact in situ (~0.3% value
# drift on fitted AND held-out states, all seeds, all of training) yet PT still collapses. So the
# transfer is not the problem. What separates the healthy runs from the collapsing ones is the decay:
# every decay=0.5 run survives phase 2 (+332, +394, +134); every decay=0.0 run does not
# (-319, +30, -594) -- including one with completely untrained consolidation. Earlier rounds never
# varied decay on its own, so that comparison was confounded (see FINDINGS.md 5.5 correction).
#
# THE MECHANISM UNDER TEST. decay_transient scales the transient's PARAMETERS but leaves Adam's
# exp_avg / exp_avg_sq for those same parameters untouched. After theta_T <- 0 the next optimiser
# step therefore displaces the zeroed weights by roughly lr * exp_avg / sqrt(exp_avg_sq) -- momentum
# from a network that no longer exists. Consolidation makes V_perm and V_trans consistent and one
# update later that consistency is destroyed. decay=0 maximises the mismatch; decay=0.5 halves it.
#
# THE GRID. decay (0.0 | 0.5) x reset_trans_optim_on_decay (false | true), 3 seeds each.
#   reset fixes decay=0     -> stale optimiser state was the mechanism; PT may be salvageable
#   only decay=0.5 matters  -> decay is the lever but via some other route
#   neither helps           -> the reset is not implicated at all; stop looking here
#
# Everything else is identical to the shipped PT config, so decay and the reset are the ONLY
# variables. Full 3.07M horizon => directly comparable to the main sweep.
#
#   python -m src_continuous_control.train --agent pt --config abl_pt_r7_decay05_noreset --seed 0
agent: "pt"

step_by_step: false
normalize_obs: true
normalize_reward: true
clip_obs: 10.0
clip_reward: 10.0
anneal_lr: true
hidden_sizes: [64, 64]
adam_eps: 0.00001
gamma: 0.99
gae_lambda: 0.95
clip_coef: 0.2
ent_coef: 0.0
max_grad_norm: 0.5
target_kl: null
normalize_advantage: true
lr_actor: 0.0003
epochs: 10
minibatch_size: 64
num_envs: 8
async_envs: true
n_steps: 256

critic_arch: "separate"
lr_trans: 0.0003
lr_perm: 0.00001
perm_optimizer: "sgd"
consolidation_epochs: 1
consolidation_buffer_size: 20480
k: 10
on_switch: "consolidate"

tasks: [1, -1]
switch: 614400
total_steps: 3072000

decay: 0.5                      # <== VARIABLE 1
reset_trans_optim_on_decay: false   # <== VARIABLE 2
