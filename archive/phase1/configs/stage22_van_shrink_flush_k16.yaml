# STAGE 22 -- the last candidate for the k=16 residual. Stage 19 ruled out the KL anchor and
# stage 21 ruled out the critic decay, leaving the Adam MOMENT FLUSH: pt_full purges the
# transient's optimizer state at every decay (C2), our controls never did. Stage 9 showed the
# flush ALONE does nothing, but shrink-with-flush vs shrink-without-flush was never tested, and
# at k=16 stale momentum has twice as long to re-inflate the shrunk weights.
env_mode: point_tasks
point_target_magnitude: 2.0
point_dt: 0.1
point_drag: 0.35
point_action_scale: 1.0
point_position_limit: 3.0
point_velocity_limit: 3.0
point_ctrl_cost_weight: 0.01
max_episode_steps: 150
tasks:
- 0.625
- -0.625
total_steps: 360000
switch: 40000
step_by_step: false
num_envs: 4
async_envs: false
n_steps: 256
epochs: 4
minibatch_size: 64
hidden_sizes:
- 32
- 32
critic_hidden_sizes:
- 32
- 32
trans_hidden_sizes:
- 32
- 32
actor_trans_hidden_sizes:
- 32
- 32
critic_trans_hidden_sizes:
- 32
- 32
normalize_obs: true
normalize_reward: true
normalizer_freeze_after: 60000
clip_obs: 10.0
clip_reward: 10.0
lr_actor: 0.0003
lr_critic: 0.0003
ent_coef: 0.0
target_kl: null
anneal_lr: false
eval_interval_updates: 4
no_eval: false
rho: 0.5
k: 8
consolidation_epochs: 2
consolidation_buffer_size: 8192
lr_trans: 0.0003
lr_perm: 0.001
lr_perm_actor: 0.001
rm_power: 0.6
rm_power_actor: 0.6
kl_prior_coef: 0.01
agent: vanilla
freeze_log_std: true
policy_shrink_every: 16
policy_shrink_factor: 0.5
critic_shrink: true
shrink_flush_optim: true
