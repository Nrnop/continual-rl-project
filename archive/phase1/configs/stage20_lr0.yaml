# STAGE 20 -- THE LAST AXIS THAT COULD SHOW A GENUINE BENEFIT.
#
# Everything so far compared lr_perm = 3e-4 (live) against lr_perm = 0 (frozen), i.e. the
# permanent either learns at full rate or not at all. The INTERMEDIATE rates were never
# swept -- and this project's own earlier finding (pt_paper.yaml, alpha_P pass 2) is that a
# permanent absorbing ~100% per cycle becomes a lagged copy of the CURRENT task instead of
# an average over tasks, which is exactly the 'too eager' failure mode.
#
# Crucially lr_perm is INDEPENDENT of rho: rho fixes the shrink, lr_perm fixes only how
# fast the permanent actually fits its target. So this varies the mechanism while holding
# the shrinkage constant -- the decoupling Stage 16 could not achieve through rho.
#
# Run under LINEAR MONOTONE DRIFT, the one regime where the permanent measured a genuine
# benefit (+8.2, p=0.010, FULL_PT 22).
#
# A middle rate beating BOTH the frozen-permanent arm AND vanilla (126.1) is a real positive result.
# A flat or monotone-down curve closes the question.
# ARM: lr_perm = lr_perm_actor = 0.0
env_mode: point_drift
point_target: 0.0
point_dt: 0.1
point_base_drag: 0.35
point_action_scale: 1.0
point_position_limit: 2.0
point_velocity_limit: 2.0
max_episode_steps: 200
drift_amplitude: 0.5
drift_period: 360000
drift_schedule: linear
drift_phase: 0.0
step_by_step: false
num_envs: 4
async_envs: false
n_steps: 256
epochs: 4
minibatch_size: 64
hidden_sizes:
- 64
- 64
critic_hidden_sizes:
- 64
- 64
trans_hidden_sizes:
- 32
- 32
actor_trans_hidden_sizes:
- 32
- 32
critic_trans_hidden_sizes:
- 32
- 32
normalize_obs: true
normalize_reward: true
normalizer_freeze_after: 60000
clip_obs: 10.0
clip_reward: 10.0
lr_actor: 0.0003
lr_critic: 0.0003
ent_coef: 0.0
target_kl: null
anneal_lr: false
total_steps: 360000
switch: 100000
eval_interval_updates: 5
no_eval: true
rho: 0.5
k: 8
consolidation_epochs: 2
consolidation_buffer_size: 8192
lr_trans: 0.0003
lr_perm: 0.0
lr_perm_actor: 0.0
rm_power: 0.6
rm_power_actor: 0.6
kl_prior_coef: 0.01
agent: pt_full
point_target_amplitude: 3.0
