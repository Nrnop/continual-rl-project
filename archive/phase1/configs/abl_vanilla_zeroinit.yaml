# VANILLA WITH A ZERO-INITIALISED CRITIC — the matched baseline Theorem 1 actually requires.
#
# Identical to configs/vanilla_paper.yaml except `critic_zero_init: true`.
#
# WHY. Theorem 1 has TWO conditions: V^(T)_0 = 0 AND V^(TD)_0 = V^(P). Every comparison in this
# project has enforced only the first. With perm_zero_init, a PT agent's acting value starts at
# EXACTLY 0; vanilla_paper's critic starts at a random function of magnitude ~0.4. The losses are
# algebraically identical but the two agents have never begun from the same function, so the
# equivalence the theorem asserts has never been tested as stated.
#
# That asymmetry matches the residual it would explain: theorem1_zeroperm vs vanilla was whole-run
# p=0.008 with NO individual phase significant -- a small consistent offset everywhere, which is
# what a different starting function produces.
#
# THE TEST. Run this against configs/abl_pt_theorem1_zeroperm.yaml (PT, mechanism off, V_P = 0,
# transient at full [64,64] width). Both agents then start at V(s) = 0 with matched capacity and
# an algebraically identical loss, which is Theorem 1's condition in full.
#
#   parity in every phase  -> Theorem 1 holds exactly; the residual was an initialisation artifact
#                             of the baseline, and the mechanism-off arm is fully accounted for.
#   deficit persists       -> the split-critic formulation differs from a single critic in a way
#                             that survives identical losses, identical capacity and identical
#                             starting functions. That would be a real and locatable defect.
#
#   python -m src_continuous_control.train --agent vanilla --config abl_vanilla_zeroinit --seed 0
#
agent: "vanilla"        # overridden by --agent

step_by_step: false
normalize_obs: true
normalize_reward: true
clip_obs: 10.0
clip_reward: 10.0
anneal_lr: false
hidden_sizes: [64, 64]
adam_eps: 0.00001
gamma: 0.99
gae_lambda: 0.95
clip_coef: 0.2
ent_coef: 0.0
max_grad_norm: 0.5
target_kl: null
normalize_advantage: true
lr_actor: 0.0003
lr_critic: 0.0003
epochs: 10
minibatch_size: 64
num_envs: 8
async_envs: true
n_steps: 256

# single critic at full width (critic_hidden_sizes defaults to hidden_sizes)

critic_zero_init: true          # V(s)=0 at t=0 — Theorem 1's second condition

jumpstart_window_updates: 20
probe_states: 256

tasks: [1, -1]
switch: 614400
total_steps: 3072000
