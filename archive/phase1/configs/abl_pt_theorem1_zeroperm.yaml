# THEOREM 1 TEST WITH A ZERO-INITIALISED PERMANENT — the equivalence test that is actually
# meaningful under function approximation.
#
# Job D killed the capacity explanation: with the mechanism off, theta_P frozen, and the transient
# at full [64,64] width matching vanilla's critic exactly, PT was STILL significantly worse than
# vanilla after a switch (whole-run p=0.001, phase 2 p=0.001, phase 4 p=0.008) while being
# indistinguishable before one (phase 1 p=0.940).
#
# What remained: with theta_P frozen at a RANDOM initialisation, the transient's target is
# R - V_perm, i.e. the value function minus a fixed, unstructured, high-frequency function it must
# cancel on every state. It memorises that cancellation on states it trains on and fails on NEW
# ones — exactly the post-switch regime. Theorem 1 licenses an arbitrary V^(P) only because the
# theorem is tabular; a table represents the offset exactly and the equivalence is free. Under deep
# FA it is not free, and this project has run every PT configuration with V_perm dominated by its
# random init (measured drift_from_init ~0.3 against value magnitudes of O(1)).
#
# With perm_zero_init and the mechanism off, the critic loss
#     (V_perm.detach() + V_trans - R)^2   ->   (V_trans - R)^2
# is EXACTLY vanilla's. So this arm must be statistically indistinguishable from vanilla in every
# phase. If it is, the random permanent offset is the cause and the fix carries to the live
# mechanism. If it still loses, the split-critic formulation itself is at fault and nothing about
# initialisation rescues it.
#
#   python -m src_continuous_control.train --agent pt --config abl_pt_theorem1_zeroperm --seed 0
#
agent: "pt"

step_by_step: false
normalize_obs: true
normalize_reward: true
clip_obs: 10.0
clip_reward: 10.0
anneal_lr: false
hidden_sizes: [64, 64]
adam_eps: 0.00001
gamma: 0.99
gae_lambda: 0.95
clip_coef: 0.2
ent_coef: 0.0
max_grad_norm: 0.5
target_kl: null
normalize_advantage: true
lr_actor: 0.0003
lr_critic: 0.0003
epochs: 10
minibatch_size: 64
num_envs: 8
async_envs: true
n_steps: 256

joint_grad_clip: false
critic_hidden_sizes: [64, 64]
perm_zero_init: true            # <== V^(P)_0 = 0 : the loss reduces EXACTLY to vanilla's   # <== full-width transient: matches vanilla's TRAINABLE capacity
lr_trans: 0.0003

# --- the mechanism, switched OFF: this is Theorem 1's condition ---
decay: 1.0                 # lambda = 1: the transient is never decayed
k: 100000                  # consolidation never fires in a 3.07M-step run
on_switch: "none"          # no boundary consolidation either
lr_perm: 0.0002            # irrelevant here (theta_P is never updated), kept for config parity
perm_optimizer: "sgd"
alpha_p_rm_power: 0.6
consolidation_epochs: 1
consolidation_buffer_size: 49152
value_preserving_consolidation: false

jumpstart_window_updates: 20
probe_states: 256

tasks: [1, -1]
switch: 614400
total_steps: 3072000
