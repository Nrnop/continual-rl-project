# PT ablation round 3 — DECAY=0 + FAST TRANSIENT (lr_trans 1e-3).
#
# Combines the two things that showed signal:
#   1. decay = 0  -> the only setting where consolidation is EXACTLY value-preserving (see
#      abl_pt_decay0.yaml for the parameter-scaling bug this avoids).
#   2. lr_trans = 1e-3 -> round 2's modest improvement at phase 3 (mean -100 -> +146, 1/5 -> 3/5
#      seeds positive), i.e. a genuine fast timescale relative to vanilla's lr_critic = 3e-4.
#
# If the decay shock was the real damage, removing it should let the faster transient actually pay
# off instead of just re-fitting after each perturbation.
#
# FULL horizon (3.07M / 5 phases, num_updates=1500) => directly comparable to the main sweep.
#   python -m src_continuous_control.train --agent pt --config abl_pt_decay0_fast --seed 0
agent: "pt"

# --- validated PPO base (identical to continual_fast) ---
step_by_step: false
normalize_obs: true
normalize_reward: true
clip_obs: 10.0
clip_reward: 10.0
anneal_lr: true
hidden_sizes: [64, 64]
adam_eps: 0.00001
gamma: 0.99
gae_lambda: 0.95
clip_coef: 0.2
ent_coef: 0.0
max_grad_norm: 0.5
target_kl: null
normalize_advantage: true
lr_actor: 0.0003
epochs: 10
minibatch_size: 64
num_envs: 8
async_envs: true
n_steps: 256

# --- PT critic knobs ---
lr_trans: 0.001             # <== fast transient (round 2's best-signal value)
lr_perm: 0.00001
perm_optimizer: "sgd"
k: 10
decay: 0.0                  # <== exact hard reset (value-preserving)
consolidation_epochs: 1
consolidation_buffer_size: 20480
on_switch: "consolidate"

# --- full continual experiment: 5 phases / 4 switches (+,-,+,-,+) ---
tasks: [1, -1]
switch: 614400
total_steps: 3072000
