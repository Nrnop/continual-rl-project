# PT ablation — UNFREEZE-PERM: raise the permanent critic LR 1e-5 -> 1e-3 so V_perm tracks the
# current task instead of staying stale. Tests whether a near-frozen permanent (so V is stale right
# after each switch) is what corrupts the advantages and collapses the policy. Switch behavior is
# left at the baseline (consolidate) so this isolates the lr_perm effect.
#   python -m src_continuous_control.train --agent pt --config abl_pt_unfreezeperm --seed 0
agent: "pt"

# --- validated PPO base (same as continual_fast) ---
step_by_step: false
normalize_obs: true
normalize_reward: true
clip_obs: 10.0
clip_reward: 10.0
anneal_lr: true
hidden_sizes: [64, 64]
adam_eps: 0.00001
gamma: 0.99
gae_lambda: 0.95
clip_coef: 0.2
ent_coef: 0.0
max_grad_norm: 0.5
target_kl: null
normalize_advantage: true
lr_actor: 0.0003
epochs: 10
minibatch_size: 64
num_envs: 8
async_envs: true
n_steps: 256

# --- PT critic knobs ---
lr_trans: 0.0003
lr_perm: 0.001              # <== ABLATION VARIABLE (unfrozen permanent critic; was 1e-5)
perm_optimizer: "sgd"
k: 10
decay: 0.5
consolidation_epochs: 1
consolidation_buffer_size: 20480
on_switch: "consolidate"

# --- 3 directional phases (2 switches): +,-,+ ---
tasks: [1, -1]
switch: 614400
total_steps: 1843200
