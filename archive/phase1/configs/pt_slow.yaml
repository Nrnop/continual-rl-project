# PT with a permanent that AVERAGES instead of tracking — the regime the theory actually describes.
#
# THE ERROR THIS CORRECTS. The alpha_P grid (FINDINGS 8.4) selected `sgd 1e-2` on the grounds that
# it absorbed 96% of the transient per consolidation, which was called "mechanism fidelity". That
# is backwards. Theorem 5 puts theta_P's fixed point at E_tau[v_tau] -- the AVERAGE over the task
# distribution. Absorbing ~100% every cycle makes the permanent a near-exact copy of the CURRENT
# transient, i.e. a lagged copy of the CURRENT TASK's value function. It never averages over
# anything, so at a switch it is confidently wrong and the transient must cancel it -- strictly
# worse than vanilla, which simply adapts. That is the "too eager" failure mode, symmetric to the
# inert one, and the previous selection walked straight into it.
#
# THE TARGET, DERIVED RATHER THAN GUESSED. Exponential averaging with per-consolidation step alpha
# has an effective window of ~1/alpha consolidations. At k=24 there are 614400/(24*2048) = 12.5
# consolidations per phase, so averaging across BOTH tasks needs a window of >= 2 phases = 25:
#
#     alpha* ~ 1/25 = 0.04        =>   target absorbed_frac in [0.02, 0.15]
#
# EVERY CONFIGURATION EVER RUN IN THIS PROJECT sits outside that band. Measured in situ:
#
#     sgd  1e-5 -> 0.005   (inert; no mechanism at all)
#         ...   ->  ???    <- NOTHING TESTED IN HERE, and the answer is in here
#     adam 1e-5 -> 0.547   (already tracking)
#     sgd  1e-3 -> 0.623
#     sgd  1e-2 -> 0.960   (what was previously selected)
#     adam 1e-4 -> 0.990
#     adam 1e-3 -> 0.999
#
# ROBBINS-MONRO. Theorem 5 holds "under assumption 1 and Robbins-Monro step-size conditions", i.e.
# a DECREASING alpha_P. Every run so far used a constant one, violating the theorem's premise: with
# a fixed step the permanent tracks rather than converges, whatever value is chosen.
# `alpha_p_rm_power: 0.6` gives alpha_P = lr_perm / (1+n)^0.6 over consolidations n, which
# satisfies sum(a)=inf, sum(a^2)<inf while decaying slowly enough to keep learning over 3.07M steps.
#
# This file is the SWEEP BASE. Drive lr_perm from the CLI:
#   python -m src_continuous_control.train --agent pt --config pt_slow --seed 0 \
#       --perm-optimizer sgd --lr-perm 5e-4 --total-steps 1843200
#
# Selection: absorbed_frac (median over the run) closest to 0.04 and inside [0.02, 0.15].
# NOT highest return -- the return ranking at n=3 is seed noise (FINDINGS 8.4.2/8.4.3).

agent: "pt"

step_by_step: false
normalize_obs: true
normalize_reward: true
clip_obs: 10.0
clip_reward: 10.0
anneal_lr: false
hidden_sizes: [64, 64]
adam_eps: 0.00001
gamma: 0.99
gae_lambda: 0.95
clip_coef: 0.2
ent_coef: 0.0
max_grad_norm: 0.5
target_kl: null
normalize_advantage: true
lr_actor: 0.0003
lr_critic: 0.0003
epochs: 10
minibatch_size: 64
num_envs: 8
async_envs: true
n_steps: 256

# --- the actor is now genuinely identical across arms ---
joint_grad_clip: false     # actor and critic clipped SEPARATELY (see PPOBase._clip_grads)

# --- dual-timescale critic ---
critic_hidden_sizes: [43, 43]
lr_trans: 0.0003
lr_perm: 0.0005            # SWEEP THIS. Placeholder mid-band value; the grid decides.
perm_optimizer: "sgd"
alpha_p_rm_power: 0.6      # Robbins-Monro: alpha_P = lr_perm / (1+n)^0.6
k: 24
decay: 0.75
consolidation_epochs: 1
consolidation_buffer_size: 49152
value_preserving_consolidation: false
on_switch: "consolidate"

jumpstart_window_updates: 20
probe_states: 256

tasks: [1, -1]
switch: 614400
total_steps: 3072000
