# STAGE 15 -- LINEAR (CONSTANT-RATE) DRIFT. Every drift run so far used drift_schedule=sin,
# whose RATE is not constant: max 1.178e-4 at the zero crossings, exactly 0 at the two
# turning points, max/mean ratio 1.57. This arm uses the constant-rate ramp -- the drift
# the proposal literally specifies.
#
# WHY IT IS A DIFFERENT TEST, not just a different waveform: a sinusoid REVISITS earlier
# configurations, so the permanent can recall. A monotone ramp never does, so the permanent
# must GENERALISE FORWARD to targets never seen. That is the harder and more honest test of
# 'consolidation captures the centroid'.
#
# NOT RATE-MATCHED, and cannot be: a bounded ramp travels 3.0 units of target over the run
# against the sinusoid's 27, so this is slow monotone drift at ~1/9 the rate. Read it as a
# separate regime, not as a matched control against Stage 13.
# ARM: pt; target ramps 0 -> 3.0 over 360k steps (rate 8.3e-6/step)
env_mode: point_drift
point_target: 0.0
point_dt: 0.1
point_base_drag: 0.35
point_action_scale: 1.0
point_position_limit: 2.0
point_velocity_limit: 2.0
max_episode_steps: 200
drift_amplitude: 0.5
drift_period: 360000
drift_schedule: linear
drift_phase: 0.0
step_by_step: false
num_envs: 4
async_envs: false
n_steps: 256
epochs: 4
minibatch_size: 64
hidden_sizes:
- 64
- 64
critic_hidden_sizes:
- 64
- 64
trans_hidden_sizes:
- 32
- 32
actor_trans_hidden_sizes:
- 32
- 32
critic_trans_hidden_sizes:
- 32
- 32
normalize_obs: true
normalize_reward: true
normalizer_freeze_after: 60000
clip_obs: 10.0
clip_reward: 10.0
lr_actor: 0.0003
lr_critic: 0.0003
ent_coef: 0.0
target_kl: null
anneal_lr: false
total_steps: 360000
switch: 100000
eval_interval_updates: 5
no_eval: true
rho: 0.5
k: 8
consolidation_epochs: 2
consolidation_buffer_size: 8192
lr_trans: 0.0003
lr_perm: 0.001
lr_perm_actor: 0.001
rm_power: 0.6
rm_power_actor: 0.6
kl_prior_coef: 0.01
agent: pt_full
point_target_amplitude: 3.0
