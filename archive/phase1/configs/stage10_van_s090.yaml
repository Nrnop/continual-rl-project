# STAGE 10 -- THE REDUCTION. Plain vanilla PPO plus ONE intervention: every k updates,
# multiply the policy's output layer by a constant < 1. No permanent network, no
# transient, no consolidation buffer, no KL anchor, no Robbins-Monro schedule.
# If this reproduces pt_full, the method's entire measured benefit on this benchmark is
# periodic policy shrinkage (Stage 9).
# shrink factor 0.9 every 8 updates (matches pt_full k=8, rho=0.10)
env_mode: point_tasks
point_target_magnitude: 2.0
point_dt: 0.1
point_drag: 0.35
point_action_scale: 1.0
point_position_limit: 3.0
point_velocity_limit: 3.0
point_ctrl_cost_weight: 0.01
max_episode_steps: 150
tasks:
- 0.625
- -0.625
total_steps: 360000
switch: 40000
step_by_step: false
num_envs: 4
async_envs: false
n_steps: 256
epochs: 4
minibatch_size: 64
hidden_sizes:
- 32
- 32
critic_hidden_sizes:
- 32
- 32
trans_hidden_sizes:
- 32
- 32
actor_trans_hidden_sizes:
- 32
- 32
critic_trans_hidden_sizes:
- 32
- 32
normalize_obs: true
normalize_reward: true
normalizer_freeze_after: 60000
clip_obs: 10.0
clip_reward: 10.0
lr_actor: 0.0003
lr_critic: 0.0003
ent_coef: 0.0
target_kl: null
anneal_lr: false
eval_interval_updates: 4
no_eval: false
rho: 0.5
k: 8
consolidation_epochs: 2
consolidation_buffer_size: 8192
lr_trans: 0.0003
lr_perm: 0.001
lr_perm_actor: 0.001
rm_power: 0.6
rm_power_actor: 0.6
kl_prior_coef: 0.01
agent: vanilla
freeze_log_std: true
policy_shrink_every: 8
policy_shrink_factor: 0.9
